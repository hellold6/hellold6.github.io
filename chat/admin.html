<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#15111F;--surface:#1A1529;--surface-raised:#2A2340;--accent:#F2A154;--accent-ink:#1A1206;--accent-2:#7FD1C3;--text:#F5F1FA;--text-dim:#A99FC2;--border:#2C2543;--radius-lg:14px;--radius-sm:10px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
  h1,h2,.brand{font-family:Space Grotesk,system-ui,sans-serif}

  /* Shell */
  #dashboard{display:none;height:100dvh}
  .layout{display:flex;height:100%}

  /* Left pane: conversations */
  #conversations{width:320px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column}
  .conversations-header{padding:16px 16px 8px;padding-top:calc(16px + var(--safe-top));font-weight:700;font-family:Space Grotesk;font-size:1.05rem;display:flex;gap:8px;align-items:center}
  .conv-toolbar{margin-left:auto;display:flex;gap:8px}
  .search-input{background:#110D1C;padding:8px 10px;border-radius:10px;border:1px solid var(--border);color:var(--text);width:100%}
  #conv-list{overflow-y:auto;flex:1}
  .conv-item{padding:12px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);transition:background .08s}
  .conv-item:hover{background:var(--surface-raised)}
  .conv-item.active{background:linear-gradient(90deg,rgba(127,209,195,0.06),transparent)}
  .conv-avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--accent-2),#4fa89a);display:flex;align-items:center;justify-content:center;font-weight:700;color:#071312}
  .conv-text{min-width:0}
  .conv-item .name{font-weight:700}
  .conv-item .preview{font-size:0.85rem;color:var(--text-dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv-meta{margin-left:auto;text-align:right;font-size:0.8rem;color:var(--text-dim)}
  .star{margin-left:8px;color:var(--text-dim);cursor:pointer}

  /* Right pane: chat panel */
  #chat-panel{flex:1;display:flex;flex-direction:column;min-width:0}
  #chat-header{display:flex;align-items:center;gap:12px;font-weight:600;padding:14px 18px;padding-top:calc(14px + var(--safe-top));border-bottom:1px solid var(--border);flex-shrink:0}
  #chat-header .tools{margin-left:auto;display:flex;gap:8px}
  #messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:18px}
  .msg-row{display:flex;flex-direction:column;gap:6px;max-width:72%}
  .msg{padding:10px 12px;border-radius:8px;background:var(--surface-raised)}
  .msg.admin{align-self:flex-end;background:linear-gradient(180deg,var(--accent),#e08b4e);color:var(--accent-ink)}
  .chat-image, .chat-video { max-width:360px; width:100%; height:auto; display:block; border-radius:12px; }
  .chat-image { cursor:pointer; }

  /* Composer */
  #composer{display:none;padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
  #composer input[type="text"]{flex:1;padding:10px 12px;border-radius:999px;border:1px solid var(--border);background:#110D1C;color:var(--text)}
  #composer .send{padding:10px 14px;border-radius:8px;border:none;background:var(--accent);color:var(--accent-ink);cursor:pointer}

  /* Small controls */
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:6px 8px;border-radius:8px;cursor:pointer}
  .badge{background:#0d1920;color:var(--accent-2);padding:6px 8px;border-radius:8px;font-weight:600}

  /* Modals */
  .modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);z-index:80}
  .modal .panel{background:var(--surface);padding:16px;border-radius:12px;border:1px solid var(--border);width:90%;max-width:560px}

  @media(max-width:800px){#conversations{width:100%;height:40vh}#chat-panel{height:60vh}}
</style>
</head>
<body>

<div id="server-restart-overlay" style="display:none"></div>

<div id="login-card" style="display:block;max-width:420px;margin:14vh auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;color:var(--text)">
  <h2 style="margin:0 0 6px">Admin Login</h2>
  <p style="color:var(--text-dim);margin:0 0 12px">Enter your admin password to continue.</p>
  <div id="login-error" style="color:#FF8080;min-height:1em;margin-bottom:8px"></div>
  <input id="password" type="password" placeholder="Password" style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);background:#110D1C;color:var(--text);margin-bottom:12px" />
  <button id="login-btn" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:var(--accent-ink);font-weight:700">Log in</button>
</div>

<div id="dashboard">
  <div class="layout" id="layout">
    <div id="conversations">
      <div class="conversations-header">
        Conversations
        <div class="conv-toolbar">
          <input id="conv-search" class="search-input" placeholder="Search conversations or messages" />
          <button id="refresh-conv" class="btn-ghost" title="Refresh">⟳</button>
        </div>
      </div>
      <div id="conv-list"></div>
    </div>
    <div id="chat-panel">
      <div id="chat-header">
        <button id="back-btn" style="display:none;background:none;border:none;color:var(--text);cursor:pointer">←</button>
        <div style="display:flex;flex-direction:column">
          <div id="chat-header-name">Select a conversation</div>
          <div id="chat-header-sub" style="font-size:0.9rem;color:var(--text-dim)"></div>
        </div>
        <div class="tools">
          <button id="export-conv" class="btn-ghost" title="Export conversation">Export</button>
          <button id="copy-username" class="btn-ghost" title="Copy username">Copy</button>
        </div>
      </div>
      <div id="messages"><div class="empty" style="color:var(--text-dim);margin:auto">Pick someone from the list to see messages.</div></div>
      <div id="upload-status" style="display:none;color:var(--text-dim);padding:8px 18px"></div>
      <div id="reply-preview" style="display:none;padding:8px 18px;border-top:1px solid var(--border);background:var(--surface-raised);align-items:center;display:flex;justify-content:space-between">
        <div class="reply-snippet">Replying to <b id="reply-snippet-text"></b></div>
        <button id="cancel-reply" class="btn-ghost">✕</button>
      </div>
      <div id="composer">
        <button id="attach-btn" class="btn-ghost" title="Attach">📎</button>
        <input id="attach-input" type="file" style="display:none" />
        <input id="message-input" type="text" placeholder="Reply..." />
        <select id="canned-select" style="border-radius:8px;border:1px solid var(--border);background:#110D1C;color:var(--text);padding:8px">
          <option value="">Insert template…</option>
        </select>
        <button id="send-btn" class="send">Send</button>
      </div>
    </div>
  </div>
</div>

<!-- Broadcast modal -->
<div id="broadcast-modal" class="modal" style="display:none">
  <div class="panel">
    <h3>Broadcast message</h3>
    <p style="color:var(--text-dim)">Send a text message to all conversations (use with care).</p>
    <textarea id="broadcast-text" rows="4" style="width:100%;padding:8px;background:#0f0b14;color:var(--text);border-radius:8px;border:1px solid var(--border)"></textarea>
    <div style="display:flex;gap:8px;margin-top:8px;justify-content:flex-end">
      <button id="broadcast-cancel" class="btn-ghost">Cancel</button>
      <button id="broadcast-send" style="background:var(--accent);color:var(--accent-ink);border:none;padding:8px 12px;border-radius:8px">Send to all</button>
    </div>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const API_BASE = "https://hellold6-github-io.onrender.com";
  let token = localStorage.getItem('admin_token');
  let socket = null;
  let conversations = [];
  let activeUserId = null;
  let messageEls = new Map();
  let messageData = new Map();
  let replyingTo = null;

  // Canned replies stored in localStorage
  const CANNED_KEY = 'admin_canned_replies_v1';
  function loadCanned() {
    try { return JSON.parse(localStorage.getItem(CANNED_KEY) || '[]'); } catch { return []; }
  }
  function saveCanned(arr) { localStorage.setItem(CANNED_KEY, JSON.stringify(arr)); }
  function populateCannedSelect() {
    const sel = document.getElementById('canned-select'); sel.innerHTML = '<option value="">Insert template…</option>';
    loadCanned().forEach((t,i) => { const o = document.createElement('option'); o.value = i; o.textContent = t.slice(0,80); sel.appendChild(o); });
  }
  populateCannedSelect();
  document.getElementById('canned-select').onchange = function(){ const v = this.value; if(!v) return; const arr = loadCanned(); document.getElementById('message-input').value = arr[Number(v)] || ''; this.value = ''; };

  // Search
  document.getElementById('conv-search').addEventListener('input', (e)=>{ const q = e.target.value.toLowerCase(); renderConversationList(q); });
  document.getElementById('refresh-conv').onclick = () => loadConversations();

  // Login
  document.getElementById('login-btn').onclick = async () => {
    const password = document.getElementById('password').value;
    try {
      const res = await fetch(`${API_BASE}/api/admin/login`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password }) });
      const data = await res.json();
      if(!res.ok){ document.getElementById('login-error').textContent = data.error || 'Login failed'; return; }
      token = data.token; localStorage.setItem('admin_token', token); startDashboard();
    } catch(err){ document.getElementById('login-error').textContent='Unable to reach server'; }
  };

  async function loadConversations(){
    try{
      const res = await fetch(`${API_BASE}/api/admin/conversations`, { headers: { Authorization: `Bearer ${token}` } });
      if(!res.ok) { logout(); return; }
      conversations = await res.json();
      renderConversationList();
    }catch(e){ console.error(e); }
  }

  function initials(name){ return (name||'?').slice(0,2).toUpperCase(); }

  function isStarred(id){ try{ return localStorage.getItem('star_conv_'+id) === '1'; }catch{return false;} }
  function toggleStar(id){ const cur = isStarred(id); try{ localStorage.setItem('star_conv_'+id, cur? '0':'1'); }catch{} renderConversationList(); }

  function renderConversationList(filter=''){
    const el = document.getElementById('conv-list'); el.innerHTML='';
    const items = conversations.filter(c=>{ if(!filter) return true; return (c.username||'').toLowerCase().includes(filter) || (c.last_message||'').toLowerCase().includes(filter); });
    // sort: starred -> recent
    items.sort((a,b)=>{ const sa = isStarred(a.id)?1:0; const sb = isStarred(b.id)?1:0; if(sa!==sb) return sb-sa; const ta = new Date(a.last_at||0).getTime(); const tb = new Date(b.last_at||0).getTime(); return tb-ta; });
    items.forEach(c=>{
      const div = document.createElement('div'); div.className='conv-item'+(c.id===activeUserId?' active':'');
      div.innerHTML = `<div class="conv-avatar">${escapeHtml(initials(c.username))}</div><div class="conv-text"><div class="name">${escapeHtml(c.username)}</div><div class="preview">${escapeHtml(c.last_message||'No messages yet')}</div></div><div class="conv-meta">${c.last_at? new Date(c.last_at).toLocaleString():''} <span class="star" data-id="${c.id}">${isStarred(c.id)?'★':'☆'}</span></div>`;
      div.onclick = ()=> openConversation(c.id, c.username);
      div.querySelector('.star').onclick = (e)=>{ e.stopPropagation(); toggleStar(c.id); };
      el.appendChild(div);
    });
  }

  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;" }[c])); }

  async function openConversation(userId, username){
    activeUserId = userId; document.getElementById('chat-header-name').textContent = username; document.getElementById('chat-header-sub').textContent = 'Loading…';
    document.getElementById('composer').style.display='flex';
    try{
      const res = await fetch(`${API_BASE}/api/admin/messages/${userId}`, { headers: { Authorization: `Bearer ${token}` } });
      const msgs = await res.json(); const messagesEl = document.getElementById('messages'); messagesEl.innerHTML=''; messageEls.clear(); messageData.clear();
      msgs.forEach(m=>{ renderMessage(m); });
      document.getElementById('chat-header-sub').textContent = `${msgs.length} messages`;
      messagesEl.scrollTop = messagesEl.scrollHeight;
      // show back button on mobile
      document.getElementById('back-btn').style.display = window.innerWidth < 720 ? 'inline-flex' : 'none';
    }catch(e){ console.error(e); }
  }

  document.getElementById('back-btn').onclick = ()=>{ document.getElementById('back-btn').style.display='none'; };

  function renderMessage(m){
    if(m.id) messageData.set(m.id, { sender:m.sender, type:m.type, content:m.content });
    const messagesEl = document.getElementById('messages');
    const wrap = document.createElement('div'); wrap.className='msg-row'; wrap.style.alignSelf = m.sender==='admin'?'flex-end':'flex-start';
    if(m.reply_to && messageData.has(m.reply_to)){ const quoted = messageData.get(m.reply_to); const who = quoted.sender==='admin'?'You':'User'; const q = document.createElement('div'); q.className='quote-block'; q.innerHTML = `<b>${escapeHtml(who)}</b> — ${escapeHtml(summarize(quoted))}`; wrap.appendChild(q); }
    const group = document.createElement('div'); group.className='msg-group';
    const div = document.createElement('div'); div.className = 'msg '+(m.sender==='admin'?'admin':'user');
    if(m.type==='image'){ const img = document.createElement('img'); img.src=m.content; img.className='chat-image'; img.loading='lazy'; img.decoding='async'; img.alt='Sent attachment'; img.onclick=()=>window.open(m.content,'_blank'); div.appendChild(img); }
    else if(m.type==='video'){ const v = document.createElement('video'); v.src=m.content; v.controls=true; v.preload='metadata'; v.playsInline=true; v.className='chat-video'; div.appendChild(v); }
    else div.textContent = m.content;
    group.appendChild(div);
    if(m.id){ const rb = document.createElement('button'); rb.className='btn-ghost'; rb.textContent='↩'; rb.title='Reply'; rb.onclick = ()=> setReplyTarget(m.id); group.appendChild(rb); }
    wrap.appendChild(group);
    if(m.created_at){ const t = document.createElement('div'); t.style.fontFamily="JetBrains Mono, monospace"; t.style.fontSize='0.8rem'; t.style.color='var(--text-dim)'; t.textContent = new Date(m.created_at).toLocaleString(); wrap.appendChild(t); }
    messagesEl.appendChild(wrap); if(m.id) messageEls.set(m.id, wrap);
  }

  function setReplyTarget(id){ const data = messageData.get(id); if(!data) return; replyingTo = { id, ...data }; document.getElementById('reply-snippet-text').textContent = `${data.sender==='admin'?'yourself':'user'}: ${summarize(data)}`; document.getElementById('reply-preview').style.display='flex'; document.getElementById('message-input').focus(); }
  document.getElementById('cancel-reply').onclick = ()=>{ replyingTo=null; document.getElementById('reply-preview').style.display='none'; };

  function summarize(m){ if(!m) return 'a message'; if(m.type==='image') return '📷 Image'; if(m.type==='video') return '🎥 Video'; return m.content.length>80?m.content.slice(0,80)+'…':m.content; }

  const MAX_IMAGE_DIMENSION = 1600;
  const JPEG_QUALITY = 0.82;
  function normalizeMimeType(value){ return String(value||'').split(';')[0].trim().toLowerCase(); }
  function compressImage(file){ return new Promise((resolve, reject)=>{
    const type = (file.type || '').toLowerCase();
    if(type === 'image/gif'){ resolve({ blob:file, mimeType:file.type || 'image/gif' }); return; }
    const img = new Image(); const objectUrl = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(objectUrl);
      let { width, height } = img;
      if(width > MAX_IMAGE_DIMENSION || height > MAX_IMAGE_DIMENSION){ const scale = MAX_IMAGE_DIMENSION / Math.max(width, height); width = Math.round(width * scale); height = Math.round(height * scale); }
      const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); if(!ctx){ reject(new Error('Canvas is not available')); return; }
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob)=>{
        if(!blob){ reject(new Error('Compression failed')); return; }
        resolve({ blob, mimeType: 'image/jpeg' });
      }, 'image/jpeg', JPEG_QUALITY);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(objectUrl); reject(new Error("Couldn't read image")); };
    img.src = objectUrl;
  }); }

  // Composer send via socket
  document.getElementById('send-btn').onclick = sendMessage;
  document.getElementById('message-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendMessage(); });

  function sendMessage(){ const text = document.getElementById('message-input').value.trim(); if(!text || !socket || !activeUserId) return; socket.emit('message', { userId: activeUserId, content: text, type:'text', replyTo: replyingTo?.id || null }); document.getElementById('message-input').value=''; replyingTo=null; document.getElementById('reply-preview').style.display='none'; }

  // Attach flow uses REST + socket as before (reusing existing logic) - kept minimal here
  document.getElementById('attach-btn').onclick = ()=> document.getElementById('attach-input').click();
  document.getElementById('attach-input').addEventListener('change', async ()=>{
    const file = document.getElementById('attach-input').files[0]; document.getElementById('attach-input').value=''; if(!file || !activeUserId || !socket) return;
    const fileName = (file.name || '').toLowerCase();
    const isVideo = file.type.startsWith('video/') || /\.(mp4|mov|webm|3gp|3g2|m4v)$/i.test(fileName);
    const rawLimit = isVideo ? 150 * 1024 * 1024 : 20 * 1024 * 1024;
    if(file.size > rawLimit){ alert(`File must be under ${Math.round(rawLimit / 1024 / 1024)}MB.`); return; }
    const uploadStatus = document.getElementById('upload-status');
    uploadStatus.style.display = 'block';
    uploadStatus.textContent = isVideo ? 'Uploading video…' : 'Processing image…';
    let blob = file; let mimeType = file.type || 'application/octet-stream';
    try {
      if(!isVideo){ ({ blob, mimeType } = await compressImage(file)); }
      const finalLimit = isVideo ? 25 * 1024 * 1024 : 5 * 1024 * 1024;
      if(blob.size > finalLimit){ alert(`File is too large for upload (${Math.round(blob.size / 1024 / 1024)}MB). Try a smaller file.`); uploadStatus.style.display='none'; return; }
      const fd = new FormData();
      fd.append('file', blob, file.name || `upload.${isVideo ? 'mp4' : 'jpg'}`);
      fd.append('mimeType', normalizeMimeType(mimeType || (isVideo ? 'video/mp4' : 'image/jpeg')));
      const res = await fetch(`${API_BASE}/api/upload`, { method:'POST', headers: { Authorization: `Bearer ${token}` }, body: fd });
      const data = await res.json();
      if(!res.ok){ alert(data.error || 'Upload failed'); uploadStatus.style.display='none'; return; }
      socket.emit('message', { userId: activeUserId, content: data.url, type: isVideo ? 'video' : 'image', replyTo: replyingTo?.id || null });
      replyingTo = null; document.getElementById('reply-preview').style.display = 'none';
    } catch(e){ alert(e.message || 'Upload failed'); }
    finally { uploadStatus.style.display = 'none'; }
  });

  // Export conversation as JSON
  document.getElementById('export-conv').onclick = async ()=>{
    if(!activeUserId) return alert('No conversation open');
    const res = await fetch(`${API_BASE}/api/admin/messages/${activeUserId}`, { headers: { Authorization: `Bearer ${token}` } });
    if(!res.ok) return alert('Export failed');
    const msgs = await res.json(); const blob = new Blob([JSON.stringify(msgs, null, 2)], { type:'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download = `conversation-${document.getElementById('chat-header-name').textContent}.json`; a.click(); URL.revokeObjectURL(url);
  };

  // Copy username
  document.getElementById('copy-username').onclick = ()=>{ const name = document.getElementById('chat-header-name').textContent; navigator.clipboard?.writeText(name); };

  // Broadcast modal
  function openBroadcast(){ document.getElementById('broadcast-modal').style.display='flex'; }
  document.getElementById('broadcast-cancel').onclick = ()=> document.getElementById('broadcast-modal').style.display='none';
  document.getElementById('broadcast-send').onclick = async ()=>{
    const text = document.getElementById('broadcast-text').value.trim(); if(!text) return; if(!socket) return alert('Connect first');
    const confirmSend = confirm(`Send this to ${conversations.length} conversations?`); if(!confirmSend) return;
    conversations.forEach(c=> socket.emit('message', { userId: c.id, content: text, type:'text' }));
    document.getElementById('broadcast-modal').style.display='none'; document.getElementById('broadcast-text').value=''; alert('Broadcast queued');
  };

  // Start dashboard: connect socket, load list
  function startDashboard(){ document.getElementById('login-card').style.display='none'; document.getElementById('dashboard').style.display='block'; populateCannedSelect();
    // socket
    socket = io(API_BASE, { auth: { token } });
    socket.on('connect', ()=>{ console.log('admin socket connected'); });
    socket.on('new-message', ({ userId, username })=>{ loadConversations(); if(userId===activeUserId) openConversation(userId, username); });
    socket.on('message-sent', (m)=>{ if(m.userId===activeUserId) renderMessage({ id:m.id, sender:'admin', type:m.type, content:m.content, reply_to:m.reply_to, created_at:m.created_at }); });
    socket.on('message-preview', ({ id, link_preview })=>{ const wrap = messageEls.get(id); if(wrap) wrap.appendChild(renderPreviewCard(link_preview)); });

    loadConversations();
  }

  function logout(){ localStorage.removeItem('admin_token'); token=null; if(socket){ socket.disconnect(); socket=null; } document.getElementById('dashboard').style.display='none'; document.getElementById('login-card').style.display='block'; }

  // Render preview card used in chat.html – copy helper
  function renderPreviewCard(preview){ const a = document.createElement('a'); a.className='preview-card'; a.href=preview.url; a.target='_blank'; a.rel='noopener noreferrer'; a.innerHTML = `${preview.image?`<img src="${escapeHtml(preview.image)}" loading="lazy"/>`:''}<div class='preview-body'><div class='preview-site'>${escapeHtml(preview.siteName||'')}</div><div class='preview-title'>${escapeHtml(preview.title||preview.url)}</div>${preview.description?`<div class='preview-desc'>${escapeHtml(preview.description)}</div>`:''}</div>`; return a; }

  // Populate conversations on load if token exists
  if(token) startDashboard();
</script>
</body>
</html>
