<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15111F;
    --surface: #1A1529;
    --surface-raised: #2A2340;
    --accent: #F2A154;
    --accent-ink: #1A1206;
    --accent-2: #7FD1C3;
    --text: #F5F1FA;
    --text-dim: #A99FC2;
    --border: #2C2543;
    --radius-lg: 20px;
    --radius-sm: 12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%;  overscroll-behavior-y: none; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
  }
  h1, h2, .brand { font-family: 'Space Grotesk', system-ui, sans-serif; }

  /* ---------- Login ---------- */
  #login-card {
    max-width: 380px; margin: 16vh auto; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px;
    box-shadow: 0 24px 60px -24px rgba(0,0,0,0.6);
  }
  #login-card h2 { margin: 0 0 4px; font-size: 1.3rem; }
  #login-card .tagline { color: var(--text-dim); font-size: 0.88rem; margin: 0 0 20px; }
  #login-card input {
    width: 100%; padding: 12px 14px; margin-bottom: 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: #110D1C; color: var(--text); font-size: 1rem; font-family: inherit;
  }
  #login-card input:focus { outline: none; border-color: var(--accent); }
  #login-card button, .composer button {
    width: 100%; padding: 12px; border-radius: var(--radius-sm); border: none;
    background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; font-family: inherit;
  }
  #login-card button:hover { filter: brightness(1.08); }
  .error { color: #FF8080; font-size: 0.85rem; min-height: 1em; margin-bottom: 8px; }

  /* ---------- Dashboard shell ---------- */
  #dashboard { display: none; height: 100dvh; }
  .layout { display: flex; height: 100%; }

  #conversations {
    width: 300px; border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0;
    background: var(--surface);
  }
  .conversations-header {
    padding: 18px 18px 12px; padding-top: calc(18px + var(--safe-top));
    font-weight: 700; font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem;
  }
  .conv-item {
    padding: 13px 18px; cursor: pointer; display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border); transition: background 0.1s ease;
  }
  .conv-item:hover { background: var(--surface-raised); }
  .conv-item.active { background: var(--surface-raised); }
  .conv-avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent-2), #4fa89a);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: #0e1f1c; font-size: 0.9rem;
  }
  .conv-text { min-width: 0; }
  .conv-item .name { font-weight: 600; font-size: 0.94rem; }
  .conv-item .preview {
    font-size: 0.8rem; color: var(--text-dim); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  #chat-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat-header {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; padding: 16px 20px; padding-top: calc(16px + var(--safe-top));
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  #back-btn { display: none; background: none; border: none; color: var(--text); font-size: 1.2rem; cursor: pointer; padding: 4px; width: auto; }

  #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; }
  .empty { color: var(--text-dim); margin: auto; font-size: 0.9rem; }

  .msg-row { display: flex; flex-direction: column; gap: 4px; max-width: 70%; animation: rise 0.2s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg-group { display: flex; align-items: flex-end; gap: 4px; }
  .msg-group.admin { flex-direction: row-reverse; }
  .msg { padding: 10px 14px; font-size: 0.92rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .msg.admin { background: var(--accent); color: var(--accent-ink); border-radius: 16px 16px 4px 16px; }
  .msg.user { background: var(--surface-raised); color: var(--text); border-radius: 16px 16px 16px 4px; }
  .msg img.chat-image { max-width: 100%; max-height: 280px; border-radius: 10px; display: block; cursor: pointer; }
  .msg video.chat-video { max-width: 100%; max-height: 320px; border-radius: 10px; display: block; background: #000; }
  .msg-time { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--text-dim); padding: 0 4px; }
  .reply-btn {
    opacity: 0; transition: opacity 0.12s ease;
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-raised); color: var(--text-dim);
    border: none; cursor: pointer; font-size: 0.85rem; padding: 0;
  }
  .msg-row:hover .reply-btn { opacity: 1; }
  .quote-block {
    border-left: 2px solid var(--accent-2);
    padding: 4px 0 4px 8px;
    font-size: 0.78rem; color: var(--text-dim);
    margin-bottom: 4px; max-width: 100%;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .quote-block b { color: var(--text); font-weight: 600; }

  .preview-card {
    max-width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm);
    overflow: hidden; text-decoration: none; color: inherit; display: block; background: var(--surface-raised);
  }
  .preview-card img { width: 100%; max-height: 150px; object-fit: cover; display: block; }
  .preview-card .preview-body { padding: 10px 12px; }
  .preview-card .preview-site { font-size: 0.7rem; color: var(--accent-2); font-weight: 500; }
  .preview-card .preview-title { font-size: 0.85rem; font-weight: 600; margin-top: 3px; }
  .preview-card .preview-desc { font-size: 0.78rem; color: var(--text-dim); margin-top: 3px; }

  .msg-row.has-embed { max-width: 100%; }
  .ig-embed {
    width: 326px; max-width: 100%; padding: 28px 16px; text-align: center; cursor: pointer;
    border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-raised);
  }
  .ig-embed:hover { border-color: var(--accent-2); }
  .ig-embed .ig-label { display: block; font-weight: 600; font-size: 0.9rem; }
  .ig-embed .ig-hint { display: block; margin-top: 4px; color: var(--text-dim); font-size: 0.78rem; }
  .ig-frame { width: 400px; max-width: 100%; height: 580px; border: 0; border-radius: var(--radius-sm); background: #fff; }

  #reply-preview {
    display: none; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 20px; border-top: 1px solid var(--border);
    background: var(--surface-raised); font-size: 0.82rem;
  }
  #reply-preview .reply-snippet { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #reply-preview .reply-snippet b { color: var(--text); }
  #reply-preview button {
    width: auto; background: none; color: var(--text-dim); font-size: 1rem; padding: 2px 6px; flex-shrink: 0;
  }
  #upload-status { display: none; font-size: 0.78rem; color: var(--text-dim); padding: 4px 20px; }

  .composer {
    display: flex; gap: 8px; align-items: center; padding: 12px 16px;
    padding-bottom: calc(12px + var(--safe-bottom));
    border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .composer input[type="text"] {
    flex: 1; padding: 11px 16px; border-radius: 999px; border: 1px solid var(--border);
    background: #110D1C; color: var(--text); font-size: 16px; font-family: inherit;
  }
  .composer input[type="text"]:focus { outline: none; border-color: var(--accent); }
  .composer button { width: auto; padding: 11px 20px; border-radius: 999px; }
  .composer button:disabled { opacity: 0.5; cursor: default; }
  #attach-btn {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; padding: 0;
    background: var(--surface-raised); font-size: 1.1rem; line-height: 1;
  }
  #attach-btn:hover { filter: brightness(1.15); }
  #attach-input { display: none; }

  /* ---------- Mobile: list <-> detail, one pane at a time ---------- */
  @media (max-width: 720px) {
    #conversations { width: 100%; border-right: none; }
    .layout.show-chat #conversations { display: none; }
    .layout:not(.show-chat) #chat-panel { display: none; }
    #back-btn { display: inline-flex; }
    .reply-btn { opacity: 1; }
  }
</style>
</head>
<body>

<div id="server-restart-overlay" aria-hidden="true">
  <div id="server-restart-dialog" role="dialog" aria-modal="true" aria-labelledby="server-restart-title">
    <h2 id="server-restart-title">server is restarting for an update</h2>
    <p>Please try again in a moment.</p>
  </div>
</div>

<div id="login-card">
  <h2>Admin Login</h2>
  <p class="tagline">Enter your admin password to continue.</p>
  <div class="error" id="login-error"></div>
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
  <button id="login-btn">Log in</button>
</div>

<div id="dashboard">
  <div class="layout" id="layout">
    <div id="conversations">
      <div class="conversations-header">Conversations</div>
      <div id="conv-list"></div>
    </div>
    <div id="chat-panel">
      <div id="chat-header">
        <button id="back-btn">←</button>
        <span id="chat-header-name">Select a conversation</span>
      </div>
      <div id="messages"><div class="empty">Pick someone from the list to see messages.</div></div>
      <div id="upload-status"></div>
      <div id="reply-preview">
        <div class="reply-snippet">Replying to <b id="reply-snippet-text"></b></div>
        <button id="cancel-reply">✕</button>
      </div>
      <div class="composer" id="composer" style="display:none;">
        <button id="attach-btn" title="Send an image or video">📎</button>
        <input id="attach-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/heic,image/heif,image/avif,video/mp4,video/webm,video/quicktime" />
        <input id="message-input" type="text" placeholder="Reply..." />
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  // ⚠️ Set this to your deployed backend URL (same as chat.html).
  const API_BASE = "https://hellold6-github-io.onrender.com";

  let token = localStorage.getItem("admin_token");
  let socket = null;
  let activeUserId = null;
  let conversations = [];
  const messageEls = new Map(); // message id -> DOM element, for attaching late link previews
  const messageData = new Map(); // message id -> {sender, type, content}, for rendering quoted replies
  let replyingTo = null; // { id, sender, type, content } | null

  const loginCard = document.getElementById("login-card");
  const dashboard = document.getElementById("dashboard");
  const loginError = document.getElementById("login-error");
  const attachInput = document.getElementById("attach-input");

  function showServerRestartPopup() {
    const overlay = document.getElementById("server-restart-overlay");
    if (!overlay) return;
    overlay.style.display = "flex";
    overlay.setAttribute("aria-hidden", "false");
  }

  function hideServerRestartPopup() {
    const overlay = document.getElementById("server-restart-overlay");
    if (!overlay) return;
    overlay.style.display = "none";
    overlay.setAttribute("aria-hidden", "true");
  }
  const layoutEl = document.getElementById("layout");
  const sendBtn = document.getElementById("send-btn");
  const replyPreview = document.getElementById("reply-preview");
  const replySnippetText = document.getElementById("reply-snippet-text");
  const uploadStatus = document.getElementById("upload-status");

  document.getElementById("login-btn").onclick = async () => {
    const password = document.getElementById("password").value;
    loginError.textContent = "";
    try {
      const res = await fetch(`${API_BASE}/api/admin/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      const data = await res.json();
      if (!res.ok) { loginError.textContent = data.error || "Login failed."; return; }
      hideServerRestartPopup();
      token = data.token;
      localStorage.setItem("admin_token", token);
      startDashboard();
    } catch {
      loginError.textContent = "Couldn't reach the server.";
      showServerRestartPopup();
    }
  };

  async function loadConversations() {
    const res = await fetch(`${API_BASE}/api/admin/conversations`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (!res.ok) { showServerRestartPopup(); logout(); return; }
    conversations = await res.json();
    renderConversationList();
  }

  function initials(name) {
    return (name || "?").slice(0, 2).toUpperCase();
  }

  function renderConversationList() {
    const el = document.getElementById("conv-list");
    el.innerHTML = "";
    conversations.forEach((c) => {
      const div = document.createElement("div");
      div.className = "conv-item" + (c.id === activeUserId ? " active" : "");
      const previewText = c.last_type === "image" ? "📷 Image" : c.last_type === "video" ? "🎥 Video" : (c.last_message || "No messages yet");
      div.innerHTML = `
        <div class="conv-avatar">${escapeHtml(initials(c.username))}</div>
        <div class="conv-text">
          <div class="name">${escapeHtml(c.username)}</div>
          <div class="preview">${escapeHtml(previewText)}</div>
        </div>`;
      div.onclick = () => openConversation(c.id, c.username);
      el.appendChild(div);
    });
  }

  async function openConversation(userId, username) {
    activeUserId = userId;
    renderConversationList();
    document.getElementById("chat-header-name").textContent = username;
    document.getElementById("composer").style.display = "flex";
    cancelReply();
    layoutEl.classList.add("show-chat"); // on mobile, switches from list to detail pane
    const res = await fetch(`${API_BASE}/api/admin/messages/${userId}`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    const msgs = await res.json();
    const messagesEl = document.getElementById("messages");
    messagesEl.innerHTML = "";
    messageEls.clear();
    messageData.clear();
    msgs.forEach(renderMessage);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  document.getElementById("back-btn").onclick = () => {
    layoutEl.classList.remove("show-chat");
  };

  function renderPreviewCard(preview) {
    const a = document.createElement("a");
    a.className = "preview-card";
    a.href = preview.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML = `
      ${preview.image ? `<img src="${escapeHtml(preview.image)}" loading="lazy" />` : ""}
      <div class="preview-body">
        <div class="preview-site">${escapeHtml(preview.siteName || "")}</div>
        <div class="preview-title">${escapeHtml(preview.title || preview.url)}</div>
        ${preview.description ? `<div class="preview-desc">${escapeHtml(preview.description)}</div>` : ""}
      </div>`;
    return a;
  }

  function formatTime(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  // ---------- Instagram embeds ----------
  // A pasted reel/post link gets a tap-to-load embed under the message. It
  // only loads Instagram's page once tapped, so scrolling stays fast.
  const INSTAGRAM_RE = /https?:\/\/(?:www\.)?instagram\.com\/(?:[A-Za-z0-9_.]+\/)?(reel|reels|p|tv)\/([A-Za-z0-9_-]+)/i;

  function renderInstagramEmbed(text) {
    const m = text.match(INSTAGRAM_RE);
    if (!m) return null;
    const kind = m[1].toLowerCase() === "reels" ? "reel" : m[1].toLowerCase();
    const src = `https://www.instagram.com/${kind}/${m[2]}/embed/`;

    const card = document.createElement("div");
    card.className = "ig-embed";
    card.setAttribute("role", "button");
    card.tabIndex = 0;
    card.innerHTML = `<span class="ig-label">Instagram ${kind === "reel" ? "reel" : "post"}</span><span class="ig-hint">Tap to load</span>`;
    const load = () => {
      const frame = document.createElement("iframe");
      frame.className = "ig-frame";
      frame.src = src;
      frame.allow = "encrypted-media; autoplay; fullscreen";
      frame.allowFullscreen = true;
      frame.setAttribute("scrolling", "no");
      card.replaceWith(frame);
    };
    card.onclick = load;
    card.onkeydown = (e) => { if (e.key === "Enter") load(); };
    return card;
  }

  function summarize(m) {
    if (!m) return "a message";
    if (m.type === "image") return "📷 Image";
    if (m.type === "video") return "🎥 Video";
    return m.content.length > 60 ? m.content.slice(0, 60) + "…" : m.content;
  }

  function renderMessage(m) {
    if (m.id) messageData.set(m.id, { sender: m.sender, type: m.type, content: m.content });

    const messagesEl = document.getElementById("messages");
    const wrap = document.createElement("div");
    wrap.className = "msg-row";
    wrap.style.alignSelf = m.sender === "admin" ? "flex-end" : "flex-start";
    wrap.style.alignItems = m.sender === "admin" ? "flex-end" : "flex-start";

    if (m.reply_to && messageData.has(m.reply_to)) {
      const quoted = messageData.get(m.reply_to);
      const who = quoted.sender === "admin" ? "You" : currentName() || "Them";
      const quote = document.createElement("div");
      quote.className = "quote-block";
      quote.innerHTML = `<b>${escapeHtml(who)}</b> — ${escapeHtml(summarize(quoted))}`;
      wrap.appendChild(quote);
    }

    const group = document.createElement("div");
    group.className = `msg-group ${m.sender === "admin" ? "admin" : "user"}`;

    const div = document.createElement("div");
    div.className = `msg ${m.sender}`;
    if (m.type === "image") {
      const img = document.createElement("img");
      img.className = "chat-image";
      img.loading = "lazy";
      img.decoding = "async";
      img.src = m.content;
      img.onclick = () => window.open(m.content, "_blank");
      div.appendChild(img);
    } else if (m.type === "video") {
      const video = document.createElement("video");
      video.className = "chat-video";
      video.src = m.content;
      video.controls = true;
      video.playsInline = true;
      video.preload = "metadata";
      div.appendChild(video);
    } else {
      div.textContent = m.content;
    }
    group.appendChild(div);

    if (m.id) {
      const replyBtn = document.createElement("button");
      replyBtn.className = "reply-btn";
      replyBtn.title = "Reply";
      replyBtn.textContent = "↩";
      replyBtn.onclick = () => setReplyTarget(m.id);
      group.appendChild(replyBtn);
    }

    wrap.appendChild(group);

    if (m.type === "text") {
      const ig = renderInstagramEmbed(m.content);
      if (ig) { wrap.classList.add("has-embed"); wrap.appendChild(ig); }
    }

    if (m.created_at) {
      const time = document.createElement("div");
      time.className = "msg-time";
      time.textContent = formatTime(m.created_at);
      wrap.appendChild(time);
    }

    if (m.link_preview) wrap.appendChild(renderPreviewCard(m.link_preview));

    messagesEl.appendChild(wrap);
    if (m.id) messageEls.set(m.id, wrap);
  }

  function setReplyTarget(id) {
    const data = messageData.get(id);
    if (!data) return;
    replyingTo = { id, ...data };
    const who = data.sender === "admin" ? "yourself" : currentName() || "them";
    replySnippetText.textContent = `${who}: ${summarize(data)}`;
    replyPreview.style.display = "flex";
    document.getElementById("message-input").focus();
  }
  function cancelReply() {
    replyingTo = null;
    replyPreview.style.display = "none";
  }
  document.getElementById("cancel-reply").onclick = cancelReply;

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function startDashboard() {
    loginCard.style.display = "none";
    dashboard.style.display = "block";
    loadConversations();

    socket = io(API_BASE, { auth: { token } });
    socket.on("connect", () => {
      hideServerRestartPopup();
    });
    socket.on("new-message", ({ userId }) => {
      loadConversations();
      if (userId === activeUserId) openConversation(userId, currentName());
    });
    socket.on("message-sent", (m) => {
      if (m.userId === activeUserId) {
        renderMessage({ id: m.id, sender: "admin", type: m.type, content: m.content, reply_to: m.reply_to, created_at: m.created_at });
      }
    });
    socket.on("message-preview", ({ id, link_preview }) => {
      const wrap = messageEls.get(id);
      if (wrap) wrap.appendChild(renderPreviewCard(link_preview));
    });
    socket.on("connect_error", () => {
      showServerRestartPopup();
      logout();
    });
  }

  function currentName() {
    const c = conversations.find((c) => c.id === activeUserId);
    return c ? c.username : "";
  }

  function logout() {
    localStorage.removeItem("admin_token");
    token = null;
    dashboard.style.display = "none";
    loginCard.style.display = "block";
  }

  function sendMessage() {
    const input = document.getElementById("message-input");
    const content = input.value;
    if (!content.trim() || !activeUserId || !socket) return;
    socket.emit("message", { userId: activeUserId, content, type: "text", replyTo: replyingTo?.id || null });
    input.value = "";
    cancelReply();
  }
  document.getElementById("send-btn").onclick = sendMessage;
  document.getElementById("message-input")?.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

  // ---------- Image compression ----------
  // Shrinks an image to a reasonable size before it's ever uploaded, so chat
  // bubbles aren't stuck decoding full 12MP camera photos just to show a
  // 260px-tall thumbnail. Animated GIFs are left alone so they keep animating.
  const MAX_IMAGE_DIMENSION = 1600;
  const JPEG_QUALITY = 0.82;

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const type = (file.type || "").toLowerCase();
      if (type === "image/gif") { resolve({ blob: file, mimeType: file.type || "image/gif" }); return; }

      const img = new Image();
      const objectUrl = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(objectUrl);
        let { width, height } = img;
        if (width > MAX_IMAGE_DIMENSION || height > MAX_IMAGE_DIMENSION) {
          const scale = MAX_IMAGE_DIMENSION / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob(
          (blob) => (blob ? resolve({ blob, mimeType: "image/jpeg" }) : reject(new Error("Compression failed"))),
          "image/jpeg",
          JPEG_QUALITY
        );
      };
      img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error("Couldn't read image")); };
      img.src = objectUrl;
    });
  }

  // ---------- Video compression ----------
  // Re-encodes through the browser's own MediaRecorder + canvas, so no large
  // library (ffmpeg.wasm etc.) needs to be downloaded. This plays the clip in
  // real time while re-recording it, so processing takes roughly as long as
  // the clip itself — fine for short chat clips, which is why length is capped.
  const MAX_VIDEO_DURATION = 90; // seconds
  const VIDEO_MAX_DIMENSION = 854; // ~480p on the long side
  const VIDEO_BITRATE = 1_200_000; // ~1.2 Mbps

  function canCompressVideo() {
    return typeof MediaRecorder !== "undefined"
      && typeof HTMLVideoElement.prototype.captureStream === "function";
  }

  function compressVideo(file, onProgress) {
    return new Promise((resolve, reject) => {
      if (!canCompressVideo()) { resolve({ blob: file, mimeType: file.type }); return; }

      const video = document.createElement("video");
      video.muted = false;
      video.playsInline = true;
      video.src = URL.createObjectURL(file);

      video.onloadedmetadata = () => {
        if (video.duration > MAX_VIDEO_DURATION) {
          URL.revokeObjectURL(video.src);
          reject(new Error(`Videos must be under ${MAX_VIDEO_DURATION} seconds.`));
          return;
        }

        let { videoWidth: width, videoHeight: height } = video;
        if (width > VIDEO_MAX_DIMENSION || height > VIDEO_MAX_DIMENSION) {
          const scale = VIDEO_MAX_DIMENSION / Math.max(width, height);
          width = Math.round(width * scale / 2) * 2;
          height = Math.round(height * scale / 2) * 2;
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");

        const canvasStream = canvas.captureStream(30);
        try {
          const audioTracks = video.captureStream().getAudioTracks();
          audioTracks.forEach((t) => canvasStream.addTrack(t));
        } catch {
          // No audio track, or captureStream not fully supported — silent video is fine.
        }

        const mimeType = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]
          .find((t) => MediaRecorder.isTypeSupported(t)) || "video/webm";
        const recorder = new MediaRecorder(canvasStream, { mimeType, videoBitsPerSecond: VIDEO_BITRATE });
        const chunks = [];
        recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
          URL.revokeObjectURL(video.src);
          resolve({ blob: new Blob(chunks, { type: mimeType }), mimeType: "video/webm" });
        };
        recorder.onerror = (e) => { URL.revokeObjectURL(video.src); reject(e.error || new Error("Recording failed")); };

        let rafId;
        const drawFrame = () => {
          ctx.drawImage(video, 0, 0, width, height);
          if (onProgress) onProgress(video.currentTime / video.duration);
          if (!video.ended) rafId = requestAnimationFrame(drawFrame);
        };

        video.onended = () => {
          cancelAnimationFrame(rafId);
          recorder.stop();
        };

        recorder.start();
        video.play().then(drawFrame).catch((err) => { recorder.stop(); reject(err); });
      };

      video.onerror = () => { URL.revokeObjectURL(video.src); reject(new Error("Couldn't read video")); };
    });
  }

  document.getElementById("attach-btn").onclick = () => attachInput.click();
  attachInput.addEventListener("change", async () => {
    const file = attachInput.files[0];
    attachInput.value = "";
    if (!file || !socket || !activeUserId) return;

    const isVideo = file.type.startsWith("video/");
    const rawLimit = isVideo ? 150 * 1024 * 1024 : 20 * 1024 * 1024;
    if (file.size > rawLimit) {
      alert(`File must be under ${Math.round(rawLimit / 1024 / 1024)}MB.`);
      return;
    }

    sendBtn.disabled = true;
    uploadStatus.style.display = "block";
    uploadStatus.textContent = isVideo ? "Compressing video…" : "Processing image…";

    let blob, mimeType;
    try {
      if (isVideo) {
        ({ blob, mimeType } = await compressVideo(file, (p) => {
          uploadStatus.textContent = `Compressing video… ${Math.round(p * 100)}%`;
        }));
      } else {
        ({ blob, mimeType } = await compressImage(file));
      }
    } catch (err) {
      alert(err.message || "Couldn't process that file.");
      uploadStatus.style.display = "none";
      sendBtn.disabled = false;
      return;
    }

    const finalLimit = isVideo ? 25 * 1024 * 1024 : 5 * 1024 * 1024;
    if (blob.size > finalLimit) {
      alert(`File is still too large after compression (${Math.round(blob.size / 1024 / 1024)}MB). Try a shorter clip.`);
      uploadStatus.style.display = "none";
      sendBtn.disabled = false;
      return;
    }

    uploadStatus.textContent = "Uploading…";
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });

    try {
      const res = await fetch(`${API_BASE}/api/upload`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ data: base64, mimeType }),
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || "Upload failed."); return; }
      socket.emit("message", { userId: activeUserId, content: data.url, type: isVideo ? "video" : "image", replyTo: replyingTo?.id || null });
      cancelReply();
    } catch {
      alert("Couldn't upload that file.");
    } finally {
      uploadStatus.style.display = "none";
      sendBtn.disabled = false;
    }
  });

  if (token) startDashboard();
</script>
</body>
</html>
