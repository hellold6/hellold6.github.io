<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat with Willow</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f1117;
    color: #e6e6e6;
    margin: 0;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #171a23;
    border: 1px solid #2a2e3a;
    border-radius: 14px;
    width: 100%;
    max-width: 480px;
    padding: 28px;
    height: fit-content;
  }
  h1 { font-size: 1.3rem; margin: 0 0 18px; }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid #33384a;
    background: #0f1117;
    color: #e6e6e6;
    font-size: 0.95rem;
  }
  button {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    background: #6c5ce7;
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button:hover { background: #5a4bd1; }
  .switch { margin-top: 12px; font-size: 0.85rem; color: #9aa0ae; text-align: center; }
  .switch a { color: #a29bfe; cursor: pointer; text-decoration: underline; }
  .error { color: #ff7675; font-size: 0.85rem; margin: -4px 0 12px; min-height: 1em; }

  #chat-view { display: none; flex-direction: column; height: 70vh; }
  #messages { flex: 1; overflow-y: auto; padding: 4px 4px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 0.92rem; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #6c5ce7; color: white; border-bottom-right-radius: 2px; }
  .msg.admin { align-self: flex-start; background: #262a38; border-bottom-left-radius: 2px; }
  .msg img.chat-image { max-width: 100%; max-height: 260px; border-radius: 8px; display: block; cursor: pointer; }
  .preview-card { max-width: 80%; border: 1px solid #33384a; border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit; display: block; background: #1c2029; }
  .preview-card img { width: 100%; max-height: 160px; object-fit: cover; display: block; }
  .preview-card .preview-body { padding: 8px 10px; }
  .preview-card .preview-site { font-size: 0.72rem; color: #9aa0ae; text-transform: uppercase; letter-spacing: 0.03em; }
  .preview-card .preview-title { font-size: 0.85rem; font-weight: 600; margin-top: 2px; }
  .preview-card .preview-desc { font-size: 0.78rem; color: #9aa0ae; margin-top: 2px; }
  .composer { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .composer input { margin-bottom: 0; flex: 1; }
  .composer button { width: auto; padding: 10px 18px; }
  #image-btn { width: auto; padding: 10px 12px; background: #262a38; font-size: 1.1rem; line-height: 1; }
  #image-btn:hover { background: #33384a; }
  #image-input { display: none; }
</style>
</head>
<body>

<div class="card" id="auth-card">
  <h1 id="auth-title">Log in</h1>
  <div class="error" id="auth-error"></div>
  <input id="username" type="text" placeholder="Username" autocomplete="username" />
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
  <button id="auth-submit">Log in</button>
  <div class="switch">
    <span id="switch-text">No account? <a id="switch-link">Register</a></span>
  </div>
</div>

<div class="card" id="chat-view">
  <h1>Chat with Willow</h1>
  <div id="messages"></div>
  <div class="composer">
    <button id="image-btn" title="Send an image">📷</button>
    <input id="image-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" />
    <input id="message-input" type="text" placeholder="Type a message..." />
    <button id="send-btn">Send</button>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  // ⚠️ Set this to your deployed backend URL (see README).
  const API_BASE = "https://hellold6-github-io.onrender.com";

  let mode = "login"; // or "register"
  let token = localStorage.getItem("chat_token");
  let socket = null;
  const messageEls = new Map(); // message id -> DOM element, so link previews can attach later

  const authCard = document.getElementById("auth-card");
  const chatView = document.getElementById("chat-view");
  const authTitle = document.getElementById("auth-title");
  const authError = document.getElementById("auth-error");
  const authSubmit = document.getElementById("auth-submit");
  const switchText = document.getElementById("switch-text");
  const switchLink = document.getElementById("switch-link");
  const messagesEl = document.getElementById("messages");
  const messageInput = document.getElementById("message-input");
  const imageInput = document.getElementById("image-input");

  switchLink.onclick = () => {
    mode = mode === "login" ? "register" : "login";
    authTitle.textContent = mode === "login" ? "Log in" : "Create an account";
    authSubmit.textContent = mode === "login" ? "Log in" : "Register";
    switchText.innerHTML = mode === "login"
      ? 'No account? <a id="switch-link">Register</a>'
      : 'Already have an account? <a id="switch-link">Log in</a>';
    document.getElementById("switch-link").onclick = switchLink.onclick;
    authError.textContent = "";
  };

  authSubmit.onclick = async () => {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    authError.textContent = "";
    if (!username || !password) { authError.textContent = "Fill in both fields."; return; }
    try {
      const res = await fetch(`${API_BASE}/api/${mode}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) { authError.textContent = data.error || "Something went wrong."; return; }
      token = data.token;
      localStorage.setItem("chat_token", token);
      startChat();
    } catch {
      authError.textContent = "Couldn't reach the server.";
    }
  };

  async function loadHistory() {
    const res = await fetch(`${API_BASE}/api/messages`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (!res.ok) { logout(); return; }
    const msgs = await res.json();
    messagesEl.innerHTML = "";
    messageEls.clear();
    msgs.forEach(renderMessage);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderPreviewCard(preview) {
    const a = document.createElement("a");
    a.className = "preview-card";
    a.href = preview.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML = `
      ${preview.image ? `<img src="${escapeAttr(preview.image)}" loading="lazy" />` : ""}
      <div class="preview-body">
        <div class="preview-site">${escapeHtml(preview.siteName || "")}</div>
        <div class="preview-title">${escapeHtml(preview.title || preview.url)}</div>
        ${preview.description ? `<div class="preview-desc">${escapeHtml(preview.description)}</div>` : ""}
      </div>`;
    return a;
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  function renderMessage(m) {
    const wrap = document.createElement("div");
    wrap.style.display = "flex";
    wrap.style.flexDirection = "column";
    wrap.style.gap = "4px";
    wrap.style.alignSelf = m.sender === "user" ? "flex-end" : "flex-start";
    wrap.style.maxWidth = "80%";

    const div = document.createElement("div");
    div.className = `msg ${m.sender}`;
    div.style.maxWidth = "100%";
    if (m.type === "image") {
      const img = document.createElement("img");
      img.className = "chat-image";
      img.src = m.content;
      img.onclick = () => window.open(m.content, "_blank");
      div.appendChild(img);
    } else {
      div.textContent = m.content;
    }
    wrap.appendChild(div);

    if (m.link_preview) {
      wrap.appendChild(renderPreviewCard(m.link_preview));
    }

    messagesEl.appendChild(wrap);
    if (m.id) messageEls.set(m.id, wrap);
  }

  function startChat() {
    authCard.style.display = "none";
    chatView.style.display = "flex";
    loadHistory();

    socket = io(API_BASE, { auth: { token } });
    socket.on("message", (m) => {
      renderMessage(m);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
    socket.on("message-preview", ({ id, link_preview }) => {
      const wrap = messageEls.get(id);
      if (wrap) wrap.appendChild(renderPreviewCard(link_preview));
    });
    socket.on("connect_error", () => { logout(); });
  }

  function logout() {
    localStorage.removeItem("chat_token");
    token = null;
    chatView.style.display = "none";
    authCard.style.display = "block";
  }

  function sendMessage() {
    const text = messageInput.value;
    if (!text.trim() || !socket) return;
    socket.emit("message", { content: text, type: "text" });
    messageInput.value = "";
  }
  document.getElementById("send-btn").onclick = sendMessage;
  messageInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

  document.getElementById("image-btn").onclick = () => imageInput.click();
  imageInput.addEventListener("change", async () => {
    const file = imageInput.files[0];
    imageInput.value = "";
    if (!file || !socket) return;
    if (file.size > 5 * 1024 * 1024) { alert("Image must be under 5MB."); return; }

    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    try {
      const res = await fetch(`${API_BASE}/api/upload`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ data: base64, mimeType: file.type }),
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || "Upload failed."); return; }
      socket.emit("message", { content: data.url, type: "image" });
    } catch {
      alert("Couldn't upload that image.");
    }
  });

  if (token) startChat();
</script>
</body>
</html>
