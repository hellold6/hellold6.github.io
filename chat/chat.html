<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat with Willow</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f1117;
    color: #e6e6e6;
    margin: 0;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #171a23;
    border: 1px solid #2a2e3a;
    border-radius: 14px;
    width: 100%;
    max-width: 480px;
    padding: 28px;
    height: fit-content;
  }
  h1 { font-size: 1.3rem; margin: 0 0 18px; }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid #33384a;
    background: #0f1117;
    color: #e6e6e6;
    font-size: 0.95rem;
  }
  button {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    background: #6c5ce7;
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button:hover { background: #5a4bd1; }
  .switch { margin-top: 12px; font-size: 0.85rem; color: #9aa0ae; text-align: center; }
  .switch a { color: #a29bfe; cursor: pointer; text-decoration: underline; }
  .error { color: #ff7675; font-size: 0.85rem; margin: -4px 0 12px; min-height: 1em; }

  #chat-view { display: none; flex-direction: column; height: 70vh; }
  #messages { flex: 1; overflow-y: auto; padding: 4px 4px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 0.92rem; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #6c5ce7; color: white; border-bottom-right-radius: 2px; }
  .msg.admin { align-self: flex-start; background: #262a38; border-bottom-left-radius: 2px; }
  .composer { display: flex; gap: 8px; margin-top: 12px; }
  .composer input { margin-bottom: 0; flex: 1; }
  .composer button { width: auto; padding: 10px 18px; }
</style>
</head>
<body>

<div class="card" id="auth-card">
  <h1 id="auth-title">Log in</h1>
  <div class="error" id="auth-error"></div>
  <input id="username" type="text" placeholder="Username" autocomplete="username" />
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
  <button id="auth-submit">Log in</button>
  <div class="switch">
    <span id="switch-text">No account? <a id="switch-link">Register</a></span>
  </div>
</div>

<div class="card" id="chat-view">
  <h1>Chat with Willow</h1>
  <div id="messages"></div>
  <div class="composer">
    <input id="message-input" type="text" placeholder="Type a message..." />
    <button id="send-btn">Send</button>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  // ⚠️ Set this to your deployed backend URL (see README).
  const API_BASE = "https://YOUR-BACKEND-URL.onrender.com";

  let mode = "login"; // or "register"
  let token = localStorage.getItem("chat_token");
  let socket = null;

  const authCard = document.getElementById("auth-card");
  const chatView = document.getElementById("chat-view");
  const authTitle = document.getElementById("auth-title");
  const authError = document.getElementById("auth-error");
  const authSubmit = document.getElementById("auth-submit");
  const switchText = document.getElementById("switch-text");
  const switchLink = document.getElementById("switch-link");
  const messagesEl = document.getElementById("messages");
  const messageInput = document.getElementById("message-input");

  switchLink.onclick = () => {
    mode = mode === "login" ? "register" : "login";
    authTitle.textContent = mode === "login" ? "Log in" : "Create an account";
    authSubmit.textContent = mode === "login" ? "Log in" : "Register";
    switchText.innerHTML = mode === "login"
      ? 'No account? <a id="switch-link">Register</a>'
      : 'Already have an account? <a id="switch-link">Log in</a>';
    document.getElementById("switch-link").onclick = switchLink.onclick;
    authError.textContent = "";
  };

  authSubmit.onclick = async () => {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    authError.textContent = "";
    if (!username || !password) { authError.textContent = "Fill in both fields."; return; }
    try {
      const res = await fetch(`${API_BASE}/api/${mode}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) { authError.textContent = data.error || "Something went wrong."; return; }
      token = data.token;
      localStorage.setItem("chat_token", token);
      startChat();
    } catch {
      authError.textContent = "Couldn't reach the server.";
    }
  };

  async function loadHistory() {
    const res = await fetch(`${API_BASE}/api/messages`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (!res.ok) { logout(); return; }
    const msgs = await res.json();
    messagesEl.innerHTML = "";
    msgs.forEach(renderMessage);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderMessage(m) {
    const div = document.createElement("div");
    div.className = `msg ${m.sender}`;
    div.textContent = m.content;
    messagesEl.appendChild(div);
  }

  function startChat() {
    authCard.style.display = "none";
    chatView.style.display = "flex";
    loadHistory();

    socket = io(API_BASE, { auth: { token } });
    socket.on("message", (m) => {
      renderMessage(m);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
    socket.on("connect_error", () => { logout(); });
  }

  function logout() {
    localStorage.removeItem("chat_token");
    token = null;
    chatView.style.display = "none";
    authCard.style.display = "block";
  }

  function sendMessage() {
    const text = messageInput.value;
    if (!text.trim() || !socket) return;
    socket.emit("message", text);
    messageInput.value = "";
  }
  document.getElementById("send-btn").onclick = sendMessage;
  messageInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

  if (token) startChat();
</script>
</body>
</html>
