<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat with Willow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15111F;
    --surface: #201A33;
    --surface-raised: #2A2340;
    --accent: #F2A154;
    --accent-ink: #1A1206;
    --accent-2: #7FD1C3;
    --text: #F5F1FA;
    --text-dim: #A99FC2;
    --border: #322A4A;
    --radius-lg: 20px;
    --radius-sm: 12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overscroll-behavior-y: none; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: radial-gradient(circle at 20% -10%, #241a3a 0%, var(--bg) 55%);
    color: var(--text);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
    padding: 24px;
    padding-top: calc(24px + var(--safe-top));
    padding-bottom: calc(24px + var(--safe-bottom));
  }
  h1, .brand { font-family: 'Space Grotesk', system-ui, sans-serif; }

  /* ---------- Auth screen ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 420px;
    padding: 32px 28px;
    height: fit-content;
    box-shadow: 0 24px 60px -24px rgba(0,0,0,0.6);
  }
  .brand { font-size: 1.5rem; font-weight: 700; margin: 0 0 4px; }
  .tagline { color: var(--text-dim); font-size: 0.92rem; margin: 0 0 24px; line-height: 1.5; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 0.78rem; color: var(--text-dim);
    margin-bottom: 6px; font-weight: 500;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: #140F20;
    color: var(--text);
    font-size: 1rem;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%;
    padding: 13px 14px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    cursor: pointer;
    font-size: 0.98rem;
    font-family: inherit;
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(0.98); }
  .switch { margin-top: 16px; font-size: 0.85rem; color: var(--text-dim); text-align: center; }
  .switch a { color: var(--accent-2); cursor: pointer; text-decoration: none; font-weight: 500; }
  .switch a:hover { text-decoration: underline; }
  .error { color: #FF8080; font-size: 0.85rem; margin: -6px 0 14px; min-height: 1em; }

  /* ---------- Chat screen ---------- */
  #chat-view {
    display: none; flex-direction: column;
    width: 100%; max-width: 440px; height: min(680px, calc(100dvh - 48px));
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: 0 24px 60px -24px rgba(0,0,0,0.6);
  }
  .chat-header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #e0824e);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--accent-ink);
    flex-shrink: 0;
  }
  .chat-header-text { line-height: 1.3; }
  .chat-header-text .name { font-weight: 600; font-size: 0.98rem; }
  .status { font-size: 0.78rem; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-2); display: inline-block; }

  #messages {
    flex: 1; overflow-y: auto;
    padding: 18px 16px;
    display: flex; flex-direction: column; gap: 10px;
    scroll-behavior: smooth;
    overscroll-behavior-y: contain;
  }
  .msg-row { display: flex; flex-direction: column; gap: 4px; max-width: 82%; animation: rise 0.22s ease-out; position: relative; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg-group { display: flex; align-items: flex-end; gap: 4px; }
  .msg-group.user { flex-direction: row-reverse; }
  .msg {
    padding: 10px 14px;
    font-size: 0.94rem; line-height: 1.45;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user {
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 16px 16px 4px 16px;
  }
  .msg.admin {
    background: var(--surface-raised);
    color: var(--text);
    border-radius: 16px 16px 16px 4px;
  }
  .msg img.chat-image { max-width: 100%; max-height: 280px; border-radius: 10px; display: block; cursor: pointer; }
  .msg video.chat-video { max-width: 100%; max-height: 320px; border-radius: 10px; display: block; background: #000; }
  .msg-time {
    font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--text-dim);
    padding: 0 4px;
  }
  .reply-btn {
    opacity: 0; transition: opacity 0.12s ease;
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-raised); color: var(--text-dim);
    border: none; cursor: pointer; font-size: 0.85rem; padding: 0;
  }
  .msg-row:hover .reply-btn { opacity: 1; }
  .quote-block {
    border-left: 2px solid var(--accent-2);
    padding: 4px 0 4px 8px;
    font-size: 0.78rem; color: var(--text-dim);
    margin-bottom: 4px; max-width: 100%;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .quote-block b { color: var(--text); font-weight: 600; }

  .preview-card {
    max-width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm);
    overflow: hidden; text-decoration: none; color: inherit; display: block;
    background: var(--surface-raised); transition: border-color 0.15s ease;
  }
  .preview-card:hover { border-color: var(--accent-2); }
  .preview-card img { width: 100%; max-height: 150px; object-fit: cover; display: block; }
  .preview-card .preview-body { padding: 10px 12px; }
  .preview-card .preview-site { font-size: 0.7rem; color: var(--accent-2); font-weight: 500; }
  .preview-card .preview-title { font-size: 0.85rem; font-weight: 600; margin-top: 3px; color: var(--text); }
  .preview-card .preview-desc { font-size: 0.78rem; color: var(--text-dim); margin-top: 3px; }

  .msg-row.has-embed { max-width: 100%; }
  .ig-embed {
    width: 326px; max-width: 100%; padding: 28px 16px; text-align: center; cursor: pointer;
    border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-raised);
  }
  .ig-embed:hover { border-color: var(--accent-2); }
  .ig-embed .ig-label { display: block; font-weight: 600; font-size: 0.9rem; }
  .ig-embed .ig-hint { display: block; margin-top: 4px; color: var(--text-dim); font-size: 0.78rem; }
  .ig-frame { width: 400px; max-width: 100%; height: 580px; border: 0; border-radius: var(--radius-sm); background: #fff; }

  #reply-preview {
    display: none; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 16px; border-top: 1px solid var(--border);
    background: var(--surface-raised); font-size: 0.82rem;
  }
  #reply-preview .reply-snippet { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #reply-preview .reply-snippet b { color: var(--text); }
  #reply-preview button {
    width: auto; background: none; color: var(--text-dim); font-size: 1rem; padding: 2px 6px; flex-shrink: 0;
  }

  .composer {
    display: flex; gap: 8px; align-items: center;
    padding: 12px 14px;
    padding-bottom: calc(12px + var(--safe-bottom));
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .composer-pill {
    flex: 1; display: flex; align-items: center; gap: 6px;
    background: #140F20; border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 6px 6px 16px;
  }
  .composer-pill input {
    border: none; background: transparent; padding: 6px 0;
    font-size: 16px; /* prevents iOS auto-zoom on focus */
  }
  .composer-pill input:focus { outline: none; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer; font-size: 1.05rem; padding: 0;
    background: transparent; color: var(--text-dim);
  }
  .icon-btn:hover { background: var(--surface-raised); color: var(--text); }
  #send-btn {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
  }
  #send-btn:disabled { opacity: 0.5; cursor: default; }
  #attach-input { display: none; }
  #upload-status {
    display: none; font-size: 0.78rem; color: var(--text-dim); padding: 4px 16px;
  }

  /* ---------- Update banner (shown only inside an outdated Android app) ---------- */
  #update-banner {
    display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    padding: calc(12px + var(--safe-top)) 16px 12px;
    background: var(--surface-raised); border-bottom: 1px solid var(--accent);
    font-size: 0.85rem; line-height: 1.45;
  }
  #update-banner .update-title { font-weight: 600; margin-bottom: 4px; }
  #update-banner .update-url {
    display: block; margin: 8px 0; padding: 8px 10px; border-radius: 8px;
    background: #140F20; color: var(--accent-2); word-break: break-all;
    font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; user-select: all;
  }
  #update-banner .update-actions { display: flex; gap: 8px; }
  #update-banner button { padding: 9px 12px; font-size: 0.85rem; }
  #update-banner #update-dismiss { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }

  /* ---------- Recent games changelog ---------- */
  #changelog-overlay {
    display: none; position: fixed; inset: 0; z-index: 60;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(10, 8, 16, 0.76);
  }
  #changelog-dialog {
    width: min(100%, 440px); max-height: min(80dvh, 600px); overflow-y: auto;
    padding: 24px; border: 1px solid var(--border); border-radius: var(--radius-lg);
    background: var(--surface); box-shadow: 0 24px 60px -24px rgba(0,0,0,0.8);
  }
  #changelog-dialog h2 {
    margin: 0 0 16px; font: 700 1.25rem 'Space Grotesk', system-ui, sans-serif;
  }
  #changelog-content { color: var(--text-dim); white-space: pre-wrap; line-height: 1.55; }
  #changelog-dismiss { margin-top: 20px; }

  /* ---------- Mobile: full-screen app feel ---------- */
  @media (max-width: 560px) {
    body { padding: 0; align-items: stretch; }
    #chat-view {
      max-width: none; width: 100%; height: 100dvh;
      border-radius: 0; border: none;
    }
    .chat-header { padding-top: calc(16px + var(--safe-top)); }
    .card { max-width: none; border-radius: 0; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; border: none; }
    .reply-btn { opacity: 1; } /* no hover on touch devices, so always show */
  }
</style>
</head>
<body>

<div id="update-banner">
  <div class="update-title">A new version of the app is available</div>
  <div id="update-desc">Update to get a notification when Willow replies. Copy this link, paste it into Chrome, then install the downloaded file.</div>
  <code class="update-url" id="update-url"></code>
  <div class="update-actions">
    <button id="update-now" style="display:none">Update now</button>
    <button id="update-copy">Copy link</button>
    <button id="update-dismiss">Not now</button>
  </div>
</div>

<div id="changelog-overlay" aria-hidden="true">
  <section id="changelog-dialog" role="dialog" aria-modal="true" aria-labelledby="changelog-title" tabindex="-1">
    <h2 id="changelog-title">NEW FEATURES</h2>
    <div id="changelog-content"></div>
    <button id="changelog-dismiss">Got it</button>
  </section>
</div>

<div class="card" id="auth-card">
  <div class="brand">Chat with Willow</div>
  <p class="tagline" id="auth-tagline">Create an account to start a conversation.</p>
  <div class="error" id="auth-error"></div>
  <div class="field">
    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username" />
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
  </div>
  <button id="auth-submit">Log in</button>
  <div class="switch">
    <span id="switch-text">No account yet? <a id="switch-link">Register</a></span>
  </div>
</div>

<div id="chat-view">
  <div class="chat-header">
    <div class="avatar">W</div>
    <div class="chat-header-text">
      <div class="name">Willow</div>
      <div class="status"><span class="dot"></span>Online</div>
    </div>
  </div>
  <div id="messages"></div>
  <div id="upload-status"></div>
  <div id="reply-preview">
    <div class="reply-snippet">Replying to <b id="reply-snippet-text"></b></div>
    <button id="cancel-reply">✕</button>
  </div>
  <div class="composer">
    <button id="attach-btn" class="icon-btn" title="Send an image or video">📎</button>
    <input id="attach-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp,video/mp4,video/webm,video/quicktime" />
    <div class="composer-pill">
      <input id="message-input" type="text" placeholder="Message Willow..." />
    </div>
    <button id="send-btn" title="Send">➤</button>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  // ⚠️ Set this to your deployed backend URL (see README).
  const API_BASE = "https://hellold6-github-io.onrender.com";

  let mode = "login"; // or "register"
  let token = localStorage.getItem("chat_token");
  let socket = null;
  const messageEls = new Map(); // message id -> DOM element, so link previews can attach later
  const messageData = new Map(); // message id -> {sender, type, content}, for rendering quoted replies
  let replyingTo = null; // { id, sender, type, content } | null

  // ---------- Update banner for the Android app ----------
  // Bump LATEST_APP_VERSION whenever you publish a new APK (it must match the
  // versionCode in the Android project's app/build.gradle.kts).
  const LATEST_APP_VERSION = 2;
  const APP_UPDATE_URL = "https://github.com/hellold6/hellold6.github.io/releases/latest";
  const CHANGELOG_SEEN_KEY = "chat_changelog_seen";

  // Apps from v2 onward add "WillowChatApp/<versionCode>" to the WebView's
  // user agent. The original app has no marker, so "inside an Android WebView
  // with no marker" means an old install.
  function maybeShowUpdateBanner() {
    const ua = navigator.userAgent;
    const marker = ua.match(/WillowChatApp\/(\d+)/);
    let outdated;
    if (marker) {
      outdated = parseInt(marker[1], 10) < LATEST_APP_VERSION;
    } else {
      const isWebView = /; wv\)/.test(ua);
      const isOtherAppBrowser = /FBAN|FBAV|Instagram|Line\/|Snapchat|TikTok|Discord|Twitter/i.test(ua);
      outdated = isWebView && !isOtherAppBrowser;
    }
    if (!outdated) return;

    try { if (localStorage.getItem("update_dismissed") === String(LATEST_APP_VERSION)) return; } catch {}

    const banner = document.getElementById("update-banner");
    document.getElementById("update-url").textContent = APP_UPDATE_URL;
    banner.style.display = "block";

    // Updated apps expose WillowApp, which downloads and installs the new APK
    // directly. Older installs don't have it, so they keep the copy-link flow.
    if (window.WillowApp && typeof window.WillowApp.installUpdate === "function") {
      document.getElementById("update-desc").textContent = "Update to get the latest changes.";
      document.getElementById("update-url").style.display = "none";
      document.getElementById("update-copy").style.display = "none";
      const nowBtn = document.getElementById("update-now");
      nowBtn.style.display = "block";
      nowBtn.onclick = () => { window.WillowApp.installUpdate(); nowBtn.textContent = "Starting…"; };
    }

    const copyBtn = document.getElementById("update-copy");
    copyBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(APP_UPDATE_URL);
        copyBtn.textContent = "Copied";
      } catch {
        // Clipboard API unavailable — the link above is selectable, so long-press to copy.
        copyBtn.textContent = "Long-press the link to copy";
      }
    };
    document.getElementById("update-dismiss").onclick = () => {
      banner.style.display = "none";
      try { localStorage.setItem("update_dismissed", String(LATEST_APP_VERSION)); } catch {}
    };
  }

  async function maybeShowChangelog() {
    try {
      const changelogUrls = [
        new URL("changelog.txt", window.location.href),
        new URL("/chat/changelog.txt", window.location.origin),
      ];
      let content;
      let lastError;
      for (const url of new Set(changelogUrls.map((candidate) => candidate.href))) {
        try {
          const response = await fetch(url, { cache: "no-store" });
          if (!response.ok) {
            lastError = new Error(`Changelog request failed (${response.status}): ${url}`);
            continue;
          }
          content = (await response.text()).trim();
          break;
        } catch (error) {
          lastError = error;
        }
      }
      if (content === undefined) throw lastError || new Error("Couldn't load the changelog.");
      if (!content) return;

      try {
        if (localStorage.getItem(CHANGELOG_SEEN_KEY) === content) return;
      } catch (error) {
        console.error("Couldn't check whether the changelog was already shown.", error);
      }

      try {
        localStorage.setItem(CHANGELOG_SEEN_KEY, content);
      } catch (error) {
        console.error("Couldn't save that the changelog was shown.", error);
      }

      const overlay = document.getElementById("changelog-overlay");
      const dialog = document.getElementById("changelog-dialog");
      document.getElementById("changelog-content").textContent = content;
      overlay.style.display = "flex";
      overlay.setAttribute("aria-hidden", "false");
      dialog.focus();

      document.getElementById("changelog-dismiss").onclick = () => {
        overlay.style.display = "none";
        overlay.setAttribute("aria-hidden", "true");
      };
    } catch (error) {
      console.error("Couldn't load the recent-games changelog.", error);
    }
  }

  // ---------- Push notifications (Android app bridge) ----------
  // The wrapped Android app calls window.registerFcmToken(token) after it
  // obtains a Firebase push token — once on launch, and again if the token
  // ever rotates. A plain browser tab never calls this, so it's inert there.
  let pendingFcmToken = null;
  function sendFcmToken(fcmToken) {
    if (!token) { pendingFcmToken = fcmToken; return; }
    fetch(`${API_BASE}/api/push/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ fcmToken }),
    }).catch(() => {});
  }
  window.registerFcmToken = sendFcmToken;

  const authCard = document.getElementById("auth-card");
  const chatView = document.getElementById("chat-view");
  const authTagline = document.getElementById("auth-tagline");
  const authError = document.getElementById("auth-error");
  const authSubmit = document.getElementById("auth-submit");
  const switchText = document.getElementById("switch-text");
  const switchLink = document.getElementById("switch-link");
  const messagesEl = document.getElementById("messages");
  const messageInput = document.getElementById("message-input");
  const attachInput = document.getElementById("attach-input");
  const sendBtn = document.getElementById("send-btn");
  const replyPreview = document.getElementById("reply-preview");
  const replySnippetText = document.getElementById("reply-snippet-text");
  const uploadStatus = document.getElementById("upload-status");

  switchLink.onclick = () => {
    mode = mode === "login" ? "register" : "login";
    authTagline.textContent = mode === "login"
      ? "Log in to continue the conversation."
      : "Create an account to start a conversation.";
    authSubmit.textContent = mode === "login" ? "Log in" : "Register";
    switchText.innerHTML = mode === "login"
      ? 'No account yet? <a id="switch-link">Register</a>'
      : 'Already have an account? <a id="switch-link">Log in</a>';
    document.getElementById("switch-link").onclick = switchLink.onclick;
    authError.textContent = "";
  };

  authSubmit.onclick = async () => {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    authError.textContent = "";
    if (!username || !password) { authError.textContent = "Fill in both fields."; return; }
    try {
      const res = await fetch(`${API_BASE}/api/${mode}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) { authError.textContent = data.error || "Something went wrong."; return; }
      token = data.token;
      localStorage.setItem("chat_token", token);
      startChat();
    } catch {
      authError.textContent = "Couldn't reach the server.";
    }
  };

  async function loadHistory() {
    const res = await fetch(`${API_BASE}/api/messages`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (!res.ok) { logout(); return; }
    const msgs = await res.json();
    messagesEl.innerHTML = "";
    messageEls.clear();
    messageData.clear();
    msgs.forEach(renderMessage);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderPreviewCard(preview) {
    const a = document.createElement("a");
    a.className = "preview-card";
    a.href = preview.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML = `
      ${preview.image ? `<img src="${escapeAttr(preview.image)}" loading="lazy" />` : ""}
      <div class="preview-body">
        <div class="preview-site">${escapeHtml(preview.siteName || "")}</div>
        <div class="preview-title">${escapeHtml(preview.title || preview.url)}</div>
        ${preview.description ? `<div class="preview-desc">${escapeHtml(preview.description)}</div>` : ""}
      </div>`;
    return a;
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  function formatTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  // ---------- Instagram embeds ----------
  // A pasted reel/post link gets a tap-to-load embed under the message. It
  // only loads Instagram's page once tapped, so scrolling stays fast.
  const INSTAGRAM_RE = /https?:\/\/(?:www\.)?instagram\.com\/(?:[A-Za-z0-9_.]+\/)?(reel|reels|p|tv)\/([A-Za-z0-9_-]+)/i;

  function renderInstagramEmbed(text) {
    const m = text.match(INSTAGRAM_RE);
    if (!m) return null;
    const kind = m[1].toLowerCase() === "reels" ? "reel" : m[1].toLowerCase();
    const src = `https://www.instagram.com/${kind}/${m[2]}/embed/`;

    const card = document.createElement("div");
    card.className = "ig-embed";
    card.setAttribute("role", "button");
    card.tabIndex = 0;
    card.innerHTML = `<span class="ig-label">Instagram ${kind === "reel" ? "reel" : "post"}</span><span class="ig-hint">Tap to load</span>`;
    const load = () => {
      const frame = document.createElement("iframe");
      frame.className = "ig-frame";
      frame.src = src;
      frame.allow = "encrypted-media; autoplay; fullscreen";
      frame.allowFullscreen = true;
      frame.setAttribute("scrolling", "no");
      card.replaceWith(frame);
    };
    card.onclick = load;
    card.onkeydown = (e) => { if (e.key === "Enter") load(); };
    return card;
  }

  function summarize(m) {
    if (!m) return "a message";
    if (m.type === "image") return "📷 Image";
    if (m.type === "video") return "🎥 Video";
    return m.content.length > 60 ? m.content.slice(0, 60) + "…" : m.content;
  }

  function renderMessage(m) {
    if (m.id) messageData.set(m.id, { sender: m.sender, type: m.type, content: m.content });

    const wrap = document.createElement("div");
    wrap.className = "msg-row";
    wrap.style.alignSelf = m.sender === "user" ? "flex-end" : "flex-start";
    wrap.style.alignItems = m.sender === "user" ? "flex-end" : "flex-start";

    if (m.reply_to && messageData.has(m.reply_to)) {
      const quoted = messageData.get(m.reply_to);
      const who = quoted.sender === "user" ? "You" : "Willow";
      const quote = document.createElement("div");
      quote.className = "quote-block";
      quote.innerHTML = `<b>${escapeHtml(who)}</b> — ${escapeHtml(summarize(quoted))}`;
      wrap.appendChild(quote);
    }

    const group = document.createElement("div");
    group.className = `msg-group ${m.sender === "user" ? "user" : "admin"}`;

    const div = document.createElement("div");
    div.className = `msg ${m.sender}`;
    if (m.type === "image") {
      const img = document.createElement("img");
      img.className = "chat-image";
      img.loading = "lazy";
      img.decoding = "async";
      img.src = m.content;
      img.onclick = () => window.open(m.content, "_blank");
      div.appendChild(img);
    } else if (m.type === "video") {
      const video = document.createElement("video");
      video.className = "chat-video";
      video.src = m.content;
      video.controls = true;
      video.playsInline = true;
      video.preload = "metadata";
      div.appendChild(video);
    } else {
      div.textContent = m.content;
    }
    group.appendChild(div);

    if (m.id) {
      const replyBtn = document.createElement("button");
      replyBtn.className = "reply-btn";
      replyBtn.title = "Reply";
      replyBtn.textContent = "↩";
      replyBtn.onclick = () => setReplyTarget(m.id);
      group.appendChild(replyBtn);
    }

    wrap.appendChild(group);

    if (m.type === "text") {
      const ig = renderInstagramEmbed(m.content);
      if (ig) { wrap.classList.add("has-embed"); wrap.appendChild(ig); }
    }

    if (m.created_at) {
      const time = document.createElement("div");
      time.className = "msg-time";
      time.textContent = formatTime(m.created_at);
      wrap.appendChild(time);
    }

    if (m.link_preview) {
      wrap.appendChild(renderPreviewCard(m.link_preview));
    }

    messagesEl.appendChild(wrap);
    if (m.id) messageEls.set(m.id, wrap);
  }

  function setReplyTarget(id) {
    const data = messageData.get(id);
    if (!data) return;
    replyingTo = { id, ...data };
    const who = data.sender === "user" ? "yourself" : "Willow";
    replySnippetText.textContent = `${who}: ${summarize(data)}`;
    replyPreview.style.display = "flex";
    messageInput.focus();
  }
  document.getElementById("cancel-reply").onclick = () => {
    replyingTo = null;
    replyPreview.style.display = "none";
  };

  function startChat() {
    authCard.style.display = "none";
    chatView.style.display = "flex";
    loadHistory();

    if (pendingFcmToken) { sendFcmToken(pendingFcmToken); pendingFcmToken = null; }

    socket = io(API_BASE, { auth: { token } });
    socket.on("message", (m) => {
      renderMessage(m);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
    socket.on("message-preview", ({ id, link_preview }) => {
      const wrap = messageEls.get(id);
      if (wrap) wrap.appendChild(renderPreviewCard(link_preview));
    });
    socket.on("connect_error", () => { logout(); });
  }

  function logout() {
    localStorage.removeItem("chat_token");
    token = null;
    chatView.style.display = "none";
    authCard.style.display = "block";
  }

  function sendMessage() {
    const text = messageInput.value;
    if (!text.trim() || !socket) return;
    socket.emit("message", { content: text, type: "text", replyTo: replyingTo?.id || null });
    messageInput.value = "";
    replyingTo = null;
    replyPreview.style.display = "none";
  }
  document.getElementById("send-btn").onclick = sendMessage;
  messageInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

  // ---------- Image compression ----------
  // Shrinks an image to a reasonable size before it's ever uploaded, so chat
  // bubbles aren't stuck decoding full 12MP camera photos just to show a
  // 260px-tall thumbnail. Animated GIFs are left alone so they keep animating.
  const MAX_IMAGE_DIMENSION = 1600;
  const JPEG_QUALITY = 0.82;

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      if (file.type === "image/gif") { resolve({ blob: file, mimeType: file.type }); return; }

      const img = new Image();
      const objectUrl = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(objectUrl);
        let { width, height } = img;
        if (width > MAX_IMAGE_DIMENSION || height > MAX_IMAGE_DIMENSION) {
          const scale = MAX_IMAGE_DIMENSION / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob(
          (blob) => (blob ? resolve({ blob, mimeType: "image/jpeg" }) : reject(new Error("Compression failed"))),
          "image/jpeg",
          JPEG_QUALITY
        );
      };
      img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error("Couldn't read image")); };
      img.src = objectUrl;
    });
  }

  // ---------- Video compression ----------
  // Re-encodes through the browser's own MediaRecorder + canvas, so no large
  // library (ffmpeg.wasm etc.) needs to be downloaded. This plays the clip in
  // real time while re-recording it, so processing takes roughly as long as
  // the clip itself — fine for short chat clips, which is why length is capped.
  const MAX_VIDEO_DURATION = 90; // seconds
  const VIDEO_MAX_DIMENSION = 854; // ~480p on the long side
  const VIDEO_BITRATE = 1_200_000; // ~1.2 Mbps

  function canCompressVideo() {
    return typeof MediaRecorder !== "undefined"
      && typeof HTMLVideoElement.prototype.captureStream === "function";
  }

  function compressVideo(file, onProgress) {
    return new Promise((resolve, reject) => {
      if (!canCompressVideo()) { resolve({ blob: file, mimeType: file.type }); return; }

      const video = document.createElement("video");
      video.muted = false;
      video.playsInline = true;
      video.src = URL.createObjectURL(file);

      video.onloadedmetadata = () => {
        if (video.duration > MAX_VIDEO_DURATION) {
          URL.revokeObjectURL(video.src);
          reject(new Error(`Videos must be under ${MAX_VIDEO_DURATION} seconds.`));
          return;
        }

        let { videoWidth: width, videoHeight: height } = video;
        if (width > VIDEO_MAX_DIMENSION || height > VIDEO_MAX_DIMENSION) {
          const scale = VIDEO_MAX_DIMENSION / Math.max(width, height);
          width = Math.round(width * scale / 2) * 2; // keep even dimensions for the encoder
          height = Math.round(height * scale / 2) * 2;
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");

        const canvasStream = canvas.captureStream(30);
        try {
          const audioTracks = video.captureStream().getAudioTracks();
          audioTracks.forEach((t) => canvasStream.addTrack(t));
        } catch {
          // No audio track, or captureStream not fully supported — silent video is fine.
        }

        const mimeType = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]
          .find((t) => MediaRecorder.isTypeSupported(t)) || "video/webm";
        const recorder = new MediaRecorder(canvasStream, { mimeType, videoBitsPerSecond: VIDEO_BITRATE });
        const chunks = [];
        recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
          URL.revokeObjectURL(video.src);
          resolve({ blob: new Blob(chunks, { type: mimeType }), mimeType: "video/webm" });
        };
        recorder.onerror = (e) => { URL.revokeObjectURL(video.src); reject(e.error || new Error("Recording failed")); };

        let rafId;
        const drawFrame = () => {
          ctx.drawImage(video, 0, 0, width, height);
          if (onProgress) onProgress(video.currentTime / video.duration);
          if (!video.ended) rafId = requestAnimationFrame(drawFrame);
        };

        video.onended = () => {
          cancelAnimationFrame(rafId);
          recorder.stop();
        };

        recorder.start();
        video.play().then(drawFrame).catch((err) => { recorder.stop(); reject(err); });
      };

      video.onerror = () => { URL.revokeObjectURL(video.src); reject(new Error("Couldn't read video")); };
    });
  }

  document.getElementById("attach-btn").onclick = () => attachInput.click();
  attachInput.addEventListener("change", async () => {
    const file = attachInput.files[0];
    attachInput.value = "";
    if (!file || !socket) return;

    const isVideo = file.type.startsWith("video/");
    const rawLimit = isVideo ? 150 * 1024 * 1024 : 20 * 1024 * 1024;
    if (file.size > rawLimit) {
      alert(`File must be under ${Math.round(rawLimit / 1024 / 1024)}MB.`);
      return;
    }

    sendBtn.disabled = true;
    uploadStatus.style.display = "block";
    uploadStatus.textContent = isVideo ? "Compressing video…" : "Processing image…";

    let blob, mimeType;
    try {
      if (isVideo) {
        ({ blob, mimeType } = await compressVideo(file, (p) => {
          uploadStatus.textContent = `Compressing video… ${Math.round(p * 100)}%`;
        }));
      } else {
        ({ blob, mimeType } = await compressImage(file));
      }
    } catch (err) {
      alert(err.message || "Couldn't process that file.");
      uploadStatus.style.display = "none";
      sendBtn.disabled = false;
      return;
    }

    const finalLimit = isVideo ? 25 * 1024 * 1024 : 5 * 1024 * 1024;
    if (blob.size > finalLimit) {
      alert(`File is still too large after compression (${Math.round(blob.size / 1024 / 1024)}MB). Try a shorter clip.`);
      uploadStatus.style.display = "none";
      sendBtn.disabled = false;
      return;
    }

    uploadStatus.textContent = "Uploading…";
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });

    try {
      const res = await fetch(`${API_BASE}/api/upload`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ data: base64, mimeType }),
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || "Upload failed."); return; }
      socket.emit("message", { content: data.url, type: isVideo ? "video" : "image", replyTo: replyingTo?.id || null });
      replyingTo = null;
      replyPreview.style.display = "none";
    } catch {
      alert("Couldn't upload that file.");
    } finally {
      uploadStatus.style.display = "none";
      sendBtn.disabled = false;
    }
  });

  maybeShowUpdateBanner();
  maybeShowChangelog();
  if (token) startChat();
</script>
</body>
</html>
