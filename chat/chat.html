<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08080a;
    --surface: #101013;
    --border: rgba(255,255,255,0.06);
    --text: #e8e8ea;
    --muted: #6a6a7a;
    --accent: #e8734a;
    --teto-pink: #ff7bbd;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Syne', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    color-scheme: dark;
  }
  button, input, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 1px solid var(--accent);
    outline-offset: 2px;
  }

  .logo { font-family: var(--display); font-size: 20px; letter-spacing: -1px; color: var(--text); }
  .logo span { color: var(--accent); }
  .hero-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--accent); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1.5rem;
    text-decoration: none;
    color: inherit;
    transition: 0.3s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-4px); }
  .card h1 { font-family: var(--display); font-size: 42px; letter-spacing: -2px; line-height: 0.9; margin: 0.35rem 0 0.8rem; }
  .lede { color: var(--muted); margin-bottom: 1.1rem; }

  .auth-screen {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .auth-screen .card { width: min(100%, 440px); }
  .field { display: block; margin-bottom: 0.8rem; }
  .field span, .stack-label { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 0.35rem; }
  input, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 0.7rem 0.75rem;
    font-size: 13px;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  .error { color: var(--teto-pink); min-height: 1.2em; margin-bottom: 0.6rem; }
  .btn {
    border: 1px solid var(--border);
    background: transparent;
    padding: 0.7rem 0.85rem;
    font-size: 12px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { width: 100%; background: var(--accent); border-color: var(--accent); color: #1a0d08; font-weight: 700; }
  .switch { margin-top: 0.9rem; color: var(--muted); text-align: center; }
  .text-btn { background: none; border: none; color: var(--muted); padding: 0; font-size: 12px; }
  .text-btn:hover { color: var(--accent); }
  .sound-toggle { border: 1px solid var(--border); padding: 0.35rem 0.55rem; color: var(--text); }
  .sound-toggle[aria-pressed="false"] { color: var(--muted); }
  .demo { margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .demo-actions { display: flex; gap: 0.5rem; margin-top: 0.7rem; }
  .demo-actions .btn { flex: 1; }

  .shell { height: 100dvh; display: flex; flex-direction: column; }
  .topbar { border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .topbar-inner, .column { width: min(100% - 2rem, 760px); margin: 0 auto; }
  .topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.9rem 0; }
  .brand-lockup { display: flex; align-items: baseline; gap: 0.8rem; }
  .top-meta { display: flex; align-items: center; gap: 0.9rem; }
  .status { color: var(--muted); display: flex; align-items: center; gap: 0.45rem; font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .you-btn { display: flex; align-items: center; gap: 0.45rem; background: none; border: none; color: var(--text); padding: 0; }
  .you-btn:hover { color: var(--accent); }

  .column { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #log { flex: 1; overflow-y: auto; padding: 1rem 0 0.5rem; }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); }

  .msg {
    position: relative;
    display: grid;
    grid-template-columns: 46px minmax(0, 1fr);
    column-gap: 10px;
    padding: 1px 4px 7px;
  }
  .msg.group-start { margin-top: 0.85rem; }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid var(--avatar, var(--accent));
    background: var(--surface);
    color: var(--avatar, var(--accent));
    font-family: var(--display);
    font-weight: 800;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .avatar.tiny { width: 26px; height: 26px; font-size: 10px; }
  .gutter { display: flex; align-items: flex-start; justify-content: center; }
  .gutter-time { font-size: 9px; color: var(--muted); padding-top: 0.45rem; }
  .meta { display: flex; align-items: baseline; gap: 0.5rem; margin-bottom: 0.2rem; }
  .name-btn { background: none; border: none; padding: 0; font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: -0.3px; }
  .name-btn:hover { color: var(--accent); }
  .pronouns, .meta time, .gutter-time { color: var(--muted); font-size: 11px; }
  .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.6rem 0.75rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.mine .bubble { border-color: rgba(232,115,74,0.45); background: rgba(232,115,74,0.08); }
  .bubble p { margin: 0; }
  .quote { border-left: 2px solid var(--accent); padding-left: 0.55rem; margin-bottom: 0.4rem; color: var(--muted); font-size: 12px; }
  .quote-name { display: block; color: var(--text); font-family: var(--display); font-weight: 800; font-size: 12px; }
  .reactions { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.35rem; }
  .chip {
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 999px;
    padding: 0.05rem 0.5rem;
    font-size: 12px;
  }
  .chip.mine { border-color: var(--accent); color: var(--accent); }
  .hover-bar {
    position: absolute;
    top: -14px;
    right: 8px;
    display: flex;
    gap: 1px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 2px;
    opacity: 0;
    pointer-events: none;
    z-index: 2;
  }
  .msg:hover .hover-bar, .msg:focus-within .hover-bar { opacity: 1; pointer-events: auto; }
  .emoji-btn, .reply-btn { background: transparent; border: none; padding: 0.25rem 0.4rem; }
  .reply-btn { color: var(--muted); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
  .emoji-btn:hover, .reply-btn:hover { color: var(--accent); }

  .composer { flex-shrink: 0; border-top: 1px solid var(--border); padding: 0.7rem 0 1rem; background: var(--bg); }
  .typing { color: var(--muted); font-size: 12px; min-height: 1.2em; display: flex; align-items: center; gap: 0.35rem; margin-bottom: 0.35rem; }
  .typing-dots { display: inline-flex; gap: 3px; }
  .typing-dots i {
    width: 4px; height: 4px; border-radius: 50%; background: var(--accent); display: block;
    animation: typing-bob 1s infinite ease-in-out;
  }
  .typing-dots i:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bob {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
    40% { transform: translateY(-3px); opacity: 1; }
  }
  .reply-preview {
    display: flex;
    justify-content: space-between;
    gap: 0.75rem;
    align-items: center;
    border-left: 2px solid var(--accent);
    padding: 0.25rem 0.6rem;
    margin-bottom: 0.5rem;
    color: var(--muted);
  }
  .reply-preview b { color: var(--text); font-family: var(--display); }
  .composer-note { color: var(--teto-pink); min-height: 0; }
  .composer-note:empty { display: none; }
  .composer-row { display: flex; gap: 0.5rem; align-items: center; }
  .composer-row input { flex: 1; }
  .composer-row .btn { width: auto; padding: 0.7rem 1rem; }

  .profile-layer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.62);
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .profile-card { width: min(100%, 440px); max-height: min(90dvh, 680px); overflow: auto; position: relative; }
  .profile-card:hover { transform: none; }
  .profile-close { position: absolute; top: 1rem; right: 1rem; }
  .profile-head { display: flex; gap: 0.9rem; align-items: center; margin-bottom: 0.9rem; }
  .avatar.large { width: 72px; height: 72px; font-size: 22px; }
  .profile-head h2 { font-family: var(--display); font-size: 28px; letter-spacing: -1px; line-height: 1; }
  .profile-head .handle, .joined { color: var(--muted); }
  .bio { margin: 0.8rem 0; }
  .profile-form { display: grid; gap: 0.7rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .swatches { display: flex; gap: 0.45rem; }
  .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; background: var(--swatch); }
  .swatch[data-color="accent"] { --swatch: var(--accent); }
  .swatch[data-color="pink"] { --swatch: var(--teto-pink); }
  .swatch[data-color="muted"] { --swatch: var(--muted); }
  .swatch.selected { border-color: var(--text); }
  .saved { color: var(--accent); }
  .empty-note { color: var(--muted); padding: 1.5rem 0; }

  @media (max-width: 700px) {
    .hover-bar { position: static; opacity: 1; pointer-events: auto; grid-column: 2; margin-top: 0.3rem; width: max-content; }
  }
  @media (max-width: 600px) {
    .topbar-inner, .column { width: min(100% - 1.5rem, 760px); }
    .brand-lockup { flex-direction: column; gap: 0; }
    .demo-actions { flex-direction: column; }
  }

  .view-switch { display: flex; gap: 0.75rem; }
  .view-tab[aria-selected="true"] { color: var(--accent); }
  #dm-column .dm-head { color: var(--muted); font-size: 12px; padding: 0.8rem 0 0.2rem; }
  #dm-log { flex: 1; overflow-y: auto; padding: 0.5rem 0 0.5rem; display: flex; flex-direction: column; gap: 0.65rem; }
  .dm-row { display: flex; flex-direction: column; max-width: min(100%, 460px); gap: 0.25rem; }
  .dm-row.user { align-self: flex-end; align-items: flex-end; }
  .dm-row.admin { align-self: flex-start; align-items: flex-start; }
  .dm-bubble { border: 1px solid var(--border); background: var(--surface); padding: 0.6rem 0.75rem; white-space: pre-wrap; word-break: break-word; }
  .dm-row.user .dm-bubble { border-color: rgba(232,115,74,0.45); background: rgba(232,115,74,0.08); }
  .dm-bubble img, .dm-bubble video { max-width: 100%; display: block; }
  .dm-meta { color: var(--muted); font-size: 10px; display: flex; gap: 0.45rem; align-items: center; }
  .dm-quote { border-left: 2px solid var(--accent); padding-left: 0.5rem; color: var(--muted); font-size: 12px; }
  .preview-card { display: block; border: 1px solid var(--border); color: inherit; text-decoration: none; max-width: 100%; }
  .preview-card img { width: 100%; max-height: 140px; object-fit: cover; display: block; }
  .preview-body { padding: 0.5rem 0.65rem; }
  .preview-site { color: var(--accent); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
  .preview-title { font-family: var(--display); font-weight: 800; }
  .preview-desc { color: var(--muted); font-size: 12px; }
  .ig-embed { border: 1px solid var(--border); padding: 0.7rem 0.8rem; cursor: pointer; color: var(--muted); }
  .ig-embed:hover { border-color: var(--accent); color: var(--text); }
  #dm-file { display: none; }
</style>
</head>
<body>
  <div id="auth-screen" class="auth-screen">
    <div class="card" id="auth-card">
      <h1>Chat</h1>
      <p class="lede" id="auth-lede">Sign in. The room is shared, and Willow stays a private thread.</p>
      <p class="error" id="auth-error"></p>
      <form id="auth-form">
        <label class="field"><span>Username</span><input id="username" autocomplete="username" maxlength="40"></label>
        <label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password"></label>
        <button class="btn primary" id="auth-submit" type="submit">Log in</button>
      </form>
      <p class="switch"><span id="switch-label">No account yet?</span> <button type="button" class="text-btn" id="switch-mode">Register</button></p>
      <div class="demo" id="demo-login" hidden>
        <p class="hero-tag">illustrative</p>
        <div class="demo-actions">
          <button type="button" class="btn" id="join-mara">Join as Mara</button>
          <button type="button" class="btn" id="join-jun">Join as Jun</button>
        </div>
      </div>
    </div>
  </div>

  <div id="app" class="shell" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-lockup">
          <div class="logo">Chat</div>
          <div class="view-switch" role="tablist">
            <button type="button" class="text-btn view-tab" id="show-room" role="tab" aria-selected="true">Room</button>
            <button type="button" class="text-btn view-tab" id="show-dm" role="tab" aria-selected="false">Willow</button>
          </div>
        </div>
        <div class="top-meta">
          <div class="status"><span class="dot"></span><span id="online-count">0 online</span></div>
          <button type="button" class="text-btn sound-toggle" id="sound-toggle" aria-pressed="true">sound on</button>
          <button type="button" class="you-btn" id="you-btn">
            <span id="you-avatar" class="avatar tiny"></span>
            <span id="you-name">you</span>
          </button>
          <button type="button" class="text-btn" id="logout-btn">log out</button>
        </div>
      </div>
    </header>
    <div class="column" id="room-column">
      <div id="log"></div>
      <form id="composer" class="composer">
        <div id="typing" class="typing" hidden></div>
        <div id="reply-preview" class="reply-preview" hidden></div>
        <p id="composer-note" class="composer-note"></p>
        <div class="composer-row">
          <input id="message-input" type="text" placeholder="Message the room" maxlength="2000" autocomplete="off">
          <button class="btn primary" id="send-btn" type="submit">send</button>
        </div>
      </form>
    </div>
    <div class="column" id="dm-column" hidden>
      <p class="dm-head">Private thread with Willow. Only the two of you can see it.</p>
      <div id="dm-log"></div>
      <p id="dm-upload-status" class="composer-note"></p>
      <form id="dm-composer" class="composer">
        <div id="dm-reply" class="reply-preview" hidden></div>
        <div class="composer-row">
          <button type="button" class="btn" id="dm-attach" title="Send an image or video">attach</button>
          <input id="dm-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/heic,image/heif,image/avif,video/mp4,video/webm,video/quicktime,video/3gpp,video/3gpp2,video/x-m4v,video/3gp">
          <input id="dm-input" type="text" placeholder="Message Willow" maxlength="4000" autocomplete="off">
          <button class="btn primary" id="dm-send" type="submit">send</button>
        </div>
      </form>
    </div>
  </div>

  <div id="profile-layer" class="profile-layer" hidden>
    <div class="card profile-card" role="dialog" aria-modal="true" aria-labelledby="profile-name">
      <button type="button" class="text-btn profile-close" id="profile-close">close</button>
      <div id="profile-view"></div>
      <form id="profile-form" class="profile-form" hidden>
        <label class="field"><span>Display name</span><input id="edit-name" maxlength="40"></label>
        <label class="field"><span>Pronouns</span><input id="edit-pronouns" maxlength="40"></label>
        <label class="field"><span>Bio</span><textarea id="edit-bio" maxlength="280" rows="3"></textarea></label>
        <div>
          <span class="stack-label">Avatar</span>
          <div class="swatches" id="swatches">
            <button type="button" class="swatch" data-color="accent" aria-label="Accent"></button>
            <button type="button" class="swatch" data-color="pink" aria-label="Pink"></button>
            <button type="button" class="swatch" data-color="muted" aria-label="Muted"></button>
          </div>
        </div>
        <button class="btn primary" type="submit">Save profile</button>
        <p id="profile-saved" class="saved" hidden>Saved</p>
      </form>
    </div>
  </div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const EMOJIS = ['❤️', '😂', '🔥', '👍', '👀', '🎉'];
  const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? location.origin
    : (location.protocol === 'file:' ? 'http://127.0.0.1:3000' : 'https://hellold6-github-io.onrender.com');
  const TOKEN_KEY = 'chat_token';
  const SOUND_KEY = 'chat_sound';
  let soundOn = localStorage.getItem(SOUND_KEY) !== 'off';
  let audioCtx = null;
  let heardGesture = false;

  let mode = 'login';
  let token = localStorage.getItem(TOKEN_KEY);
  let pendingFcmToken = null;
  function sendFcmToken(fcmToken) {
    if (!token) { pendingFcmToken = fcmToken; return; }
    fetch(`${API_BASE}/api/push/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ fcmToken }),
    }).catch(() => {});
  }
  window.registerFcmToken = sendFcmToken;
  let socket = null;
  let me = null;
  let messages = [];
  let replyingTo = null;
  let avatarColor = 'accent';

  const authScreen = document.getElementById('auth-screen');
  const authError = document.getElementById('auth-error');
  const app = document.getElementById('app');
  const log = document.getElementById('log');
  const messageInput = document.getElementById('message-input');
  const composerNote = document.getElementById('composer-note');
  const profileLayer = document.getElementById('profile-layer');
  const profileForm = document.getElementById('profile-form');

  function authHeaders() {
    return { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
  }

  function colorOf(name) {
    if (name === 'pink') return 'var(--teto-pink)';
    if (name === 'muted') return 'var(--muted)';
    return 'var(--accent)';
  }

  function initials(name) {
    const parts = String(name || '?').trim().split(/\s+/).slice(0, 2);
    return parts.map((part) => part[0] || '').join('').toUpperCase() || '?';
  }

  function formatTime(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  }

  function formatJoined(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function isMine(reaction) {
    return (reaction.userIds || []).map(Number).includes(Number(me.id));
  }

  document.getElementById('switch-mode').onclick = () => {
    mode = mode === 'login' ? 'register' : 'login';
    document.getElementById('auth-submit').textContent = mode === 'login' ? 'Log in' : 'Register';
    document.getElementById('switch-label').textContent = mode === 'login' ? 'No account yet?' : 'Already have an account?';
    document.getElementById('switch-mode').textContent = mode === 'login' ? 'Register' : 'Log in';
    authError.textContent = '';
  };

  document.getElementById('auth-form').onsubmit = async (event) => {
    event.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    authError.textContent = '';
    if (!username || !password) {
      authError.textContent = 'Fill in both fields.';
      return;
    }
    await loginRequest(mode === 'register' ? '/api/register' : '/api/login', { username, password });
  };

  async function loginRequest(path, body) {
    authError.textContent = '';
    try {
      const res = await fetch(`${API_BASE}${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        authError.textContent = data.error || 'Something went wrong.';
        return;
      }
      token = data.token;
      localStorage.setItem(TOKEN_KEY, token);
      startChat();
    } catch {
      authError.textContent = "Couldn't reach the server.";
    }
  }

  function paintYou() {
    const avatar = document.getElementById('you-avatar');
    avatar.textContent = initials(me.display_name);
    avatar.style.setProperty('--avatar', colorOf(me.avatar_color));
    document.getElementById('you-name').textContent = me.display_name;
  }

  function renderModeration() {
    const banned = Boolean(me.banned_at);
    const muted = me.muted_until && new Date(me.muted_until) > new Date();
    messageInput.disabled = banned || muted;
    document.getElementById('send-btn').disabled = banned || muted;
    if (banned) composerNote.textContent = 'You are banned from the room.';
    else if (muted) composerNote.textContent = `You are muted until ${formatTime(me.muted_until)}.`;
    else composerNote.textContent = '';
  }

  function markGesture() {
    heardGesture = true;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playIncoming() {
    if (!soundOn || !heardGesture || !audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(660, now);
    osc.frequency.exponentialRampToValueAtTime(440, now + 0.18);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.03, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.34);
  }

  const DM_IG = /https?:\/\/(?:www\.)?instagram\.com\/(?:[A-Za-z0-9_.]+\/)?(reel|reels|p|tv)\/([A-Za-z0-9_-]+)/i;
  function renderDmInstagram(text) {

  function compressDmImage(file) {
    return new Promise((resolve, reject) => {
      const type = (file.type || '').toLowerCase();
      if (type === 'image/gif') { resolve({ blob: file, mimeType: file.type || 'image/gif' }); return; }
      const img = new Image();
      const objectUrl = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(objectUrl);
        let { width, height } = img;
        const max = 1600;
        if (width > max || height > max) {
          const scale = max / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => (blob ? resolve({ blob, mimeType: 'image/jpeg' }) : reject(new Error('Compression failed'))), 'image/jpeg', 0.82);
      };
      img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error("Couldn't read image")); };
      img.src = objectUrl;
    });
  }

  document.getElementById('dm-file').addEventListener('change', async () => {

    if (!file || !socket) return;
    const fileName = (file.name || '').toLowerCase();
    const isVideo = file.type.startsWith('video/') || /\.(mp4|mov|webm|3gp|3g2|m4v)$/i.test(fileName);
    const rawLimit = isVideo ? 150 * 1024 * 1024 : 20 * 1024 * 1024;
    if (file.size > rawLimit) { alert(`File must be under ${Math.round(rawLimit / 1024 / 1024)}MB.`); return; }
    const status = document.getElementById('dm-upload-status');
    const send = document.getElementById('dm-send');
    send.disabled = true;
    status.textContent = isVideo ? 'Uploading video…' : 'Processing image…';
    try {
      let blob = file;
      let mimeType = isVideo ? (file.type || 'video/mp4') : file.type;
      if (!isVideo) ({ blob, mimeType } = await compressDmImage(file));
      const finalLimit = isVideo ? 25 * 1024 * 1024 : 5 * 1024 * 1024;
      if (blob.size > finalLimit) { alert(`File is too large for upload (${Math.round(blob.size / 1024 / 1024)}MB).`); return; }
      status.textContent = 'Uploading…';
      const formData = new FormData();
      formData.append('file', blob, file.name || `upload.${isVideo ? 'mp4' : 'jpg'}`);
      formData.append('mimeType', String(mimeType || (isVideo ? 'video/mp4' : 'image/jpeg')).split(';')[0].trim().toLowerCase());
      const res = await fetch(`${API_BASE}/api/upload`, { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: formData });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { alert(data.error || 'Upload failed.'); return; }
      socket.emit('message', { content: data.url, type: isVideo ? 'video' : 'image', replyTo: dmReplyingTo ? dmReplyingTo.id : null });
      dmReplyingTo = null;
      document.getElementById('dm-reply').hidden = true;
    } catch (err) {
      alert(err.message || "Couldn't upload that file.");
    } finally {
      status.textContent = '';
      send.disabled = false;
    }
  });

  if (token) startChat();
</script>
</body>
</html>
