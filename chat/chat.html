<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat with Willow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0c16;
    --surface: #17121e;
    --surface-raised: #211827;
    --accent: #ffb86b;
    --accent-ink: #24160a;
    --accent-2: #7bd5c9;
    --text: #f6f3f8;
    --text-dim: #9b91a9;
    --border: rgba(255,255,255,0.04);
    --radius-lg: 18px;
    --radius-sm: 12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: radial-gradient(circle at 10% -10%, #241a3a 0%, var(--bg) 45%);
    color: var(--text);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
    padding: 28px;
    padding-top: calc(28px + var(--safe-top));
    padding-bottom: calc(28px + var(--safe-bottom));
  }
  h1, .brand { font-family: 'Space Grotesk', system-ui, sans-serif; }

  /* ---------- Card (auth) ---------- */
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent), var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 520px;
    padding: 36px 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 30px 70px rgba(0,0,0,0.65); }
  .brand { font-size: 1.6rem; font-weight: 700; margin: 0 0 6px; }
  .tagline { color: var(--text-dim); font-size: 0.96rem; margin: 0 0 18px; line-height: 1.45; }
  .field { margin-bottom: 14px; }
  .field label { display:block; font-size:0.78rem; color:var(--text-dim); margin-bottom:6px; font-weight:500; }
  input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:#110f16; color:var(--text); font-size:1rem; font-family:inherit; }
  input:focus { outline:none; box-shadow: 0 0 0 4px rgba(255,184,107,0.08); border-color: rgba(255,184,107,0.22); }
  .error { color:#ff8b8b; font-size:0.88rem; margin:-6px 0 12px; min-height:1em; }
  button { width:100%; padding:13px 14px; border-radius:12px; border:none; background:var(--accent); color:var(--accent-ink); font-weight:700; cursor:pointer; font-size:0.98rem; font-family:inherit; box-shadow: 0 6px 20px rgba(38,22,9,0.25); transition: transform 0.08s ease, filter 0.12s ease; }
  button:hover { filter:brightness(1.02); transform: translateY(-1px); }
  .switch { margin-top:14px; font-size:0.88rem; color:var(--text-dim); text-align:center; }
  .switch a { color:var(--accent-2); cursor:pointer; font-weight:600; text-decoration:none; }
  .switch a:hover { text-decoration:underline; }

  /* ---------- Chat screen ---------- */
  #chat-view { display:none; flex-direction:column; width:100%; max-width:560px; height: min(760px, calc(100dvh - 56px)); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.6); }
  .chat-header { display:flex; align-items:center; gap:14px; padding:18px 20px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .avatar { width:48px; height:48px; border-radius:50%; background:linear-gradient(135deg,var(--accent), #e08b4e); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; font-weight:700; color:var(--accent-ink); font-size:1.05rem; flex-shrink:0; box-shadow:0 6px 18px rgba(0,0,0,0.45); }
  .chat-header-text .name { font-weight:700; font-size:1.02rem; }
  .status { font-size:0.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; }
  .status .dot { width:8px; height:8px; border-radius:50%; background:var(--accent-2); display:inline-block; box-shadow:0 0 8px rgba(123,213,201,0.14); }

  #messages { flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth; }
  .msg-row { display:flex; flex-direction:column; gap:6px; max-width:82%; position:relative; }
  .msg-group { display:flex; align-items:flex-end; gap:8px; }
  .msg-group.user { flex-direction:row-reverse; }

  .msg { padding:12px 14px; font-size:0.96rem; line-height:1.4; white-space:pre-wrap; word-break:break-word; box-shadow:0 6px 18px rgba(0,0,0,0.35); }
  .msg.user { background:linear-gradient(180deg,var(--accent), #f0a86a); color:var(--accent-ink); border-radius:18px 18px 6px 18px; }
  .msg.admin { background:linear-gradient(180deg, var(--surface-raised), #2b1f34); color:var(--text); border-radius:18px 18px 18px 6px; }
  .msg img.chat-image, .msg video.chat-video { max-width:100%; border-radius:12px; display:block; }
  .msg-time { font-family:'JetBrains Mono', monospace; font-size:0.7rem; color:var(--text-dim); padding:0 4px; }
  .reply-btn { opacity:0; transition:opacity 0.12s ease; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:transparent; color:var(--text-dim); border:none; cursor:pointer; }
  .msg-row:hover .reply-btn { opacity:1; }
  .quote-block { border-left:3px solid var(--accent-2); padding:6px 8px; font-size:0.82rem; color:var(--text-dim); margin-bottom:6px; border-radius:6px; background:rgba(255,255,255,0.01); }

  .preview-card { max-width:100%; border:1px solid var(--border); border-radius:12px; overflow:hidden; text-decoration:none; color:inherit; display:block; background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent); transition:transform 0.12s ease, box-shadow 0.12s ease; }
  .preview-card:hover { transform:translateY(-4px); box-shadow:0 20px 40px rgba(0,0,0,0.45); }
  .preview-card img { width:100%; max-height:160px; object-fit:cover; display:block; }
  .preview-body { padding:11px 12px; }
  .preview-site { font-size:0.72rem; color:var(--accent-2); font-weight:600; }
  .preview-title { font-size:0.9rem; font-weight:700; margin-top:6px; color:var(--text); }
  .preview-desc { font-size:0.8rem; color:var(--text-dim); margin-top:6px; }

  .ig-embed { width:340px; max-width:100%; padding:20px 14px; text-align:center; cursor:pointer; border:1px solid var(--border); border-radius:12px; background:var(--surface-raised); }
  .ig-embed:hover { border-color:var(--accent-2); }

  #reply-preview { display:none; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; border-top:1px solid var(--border); background:var(--surface-raised); }
  .reply-snippet { color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .reply-snippet b { color:var(--text); }

  .composer { display:flex; gap:10px; align-items:center; padding:14px 16px; padding-bottom:calc(14px + var(--safe-bottom)); border-top:1px solid var(--border); }
  .composer-pill { flex:1; display:flex; align-items:center; gap:10px; background:#120e18; border:1px solid var(--border); border-radius:999px; padding:8px 12px; }
  .composer-pill input { border:none; background:transparent; padding:8px 0; font-size:15px; color:var(--text); }
  .composer-pill input:focus { outline:none; }

  .icon-btn { width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:none; cursor:pointer; font-size:1.05rem; padding:0; background:transparent; color:var(--text-dim); }
  .icon-btn:hover { background:var(--surface-raised); color:var(--text); }
  #send-btn { width:46px; height:46px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-size:1.15rem; border:none; box-shadow:0 8px 30px rgba(38,22,9,0.28); }
  #send-btn:disabled { opacity:0.5; cursor:default; transform:none; box-shadow:none; }
  #attach-input { display:none; }
  #upload-status { display:none; font-size:0.84rem; color:var(--text-dim); padding:8px 16px; }

  /* responsive tweaks */
  @media (max-width: 560px) {
    body { padding: 0; align-items: stretch; }
    .card { max-width: none; border-radius:0; min-height:100dvh; display:flex; flex-direction:column; justify-content:center; }
    #chat-view { max-width:none; width:100%; height:100dvh; border-radius:0; }
    .avatar { width:40px; height:40px; }
    #messages { padding:14px; }
    .reply-btn { opacity:1; }
  }

  /* subtle scrollbar */
  #messages::-webkit-scrollbar { width:10px; }
  #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.04); border-radius:999px; }
</style>
</head>
<body>

<div class="card" id="auth-card">
  <div class="brand">Chat with Willow</div>
  <p class="tagline" id="auth-tagline">Create an account to start a conversation.</p>
  <div class="error" id="auth-error"></div>
  <div class="field">
    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username" />
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
  </div>
  <button id="auth-submit">Log in</button>
  <div class="switch">
    <span id="switch-text">No account yet? <a id="switch-link">Register</a></span>
  </div>
</div>

<div id="chat-view">
  <div class="chat-header">
    <div class="avatar">W</div>
    <div class="chat-header-text">
      <div class="name">Willow</div>
      <div class="status"><span class="dot"></span>Online</div>
    </div>
  </div>
  <div id="messages"></div>
  <div id="upload-status"></div>
  <div id="reply-preview">
    <div class="reply-snippet">Replying to <b id="reply-snippet-text"></b></div>
    <button id="cancel-reply">✕</button>
  </div>
  <div class="composer">
    <button id="attach-btn" class="icon-btn" title="Send an image or video">📎</button>
    <input id="attach-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/heic,image/heif,image/avif,video/mp4,video/webm,video/quicktime,video/3gpp,video/3gpp2,video/x-m4v,video/3gp" />
    <div class="composer-pill">
      <input id="message-input" type="text" placeholder="Message Willow..." />
    </div>
    <button id="send-btn" title="Send">➤</button>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" defer></script>
<script>
  // ⚠️ Set this to your deployed backend URL (see README).
  const API_BASE = "https://hellold6-github-io.onrender.com";

  let mode = "login"; // or "register"
  let token = localStorage.getItem("chat_token");
  let socket = null;
  const messageEls = new Map();
  const messageData = new Map();
  let replyingTo = null;

  // Push token bridge (kept)
  let pendingFcmToken = null;
  function sendFcmToken(fcmToken) {
    if (!token) { pendingFcmToken = fcmToken; return; }
    fetch(`${API_BASE}/api/push/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ fcmToken }),
    }).catch(() => {});
  }
  window.registerFcmToken = sendFcmToken;

  const authCard = document.getElementById("auth-card");
  const chatView = document.getElementById("chat-view");
  const authTagline = document.getElementById("auth-tagline");
  const authError = document.getElementById("auth-error");
  const authSubmit = document.getElementById("auth-submit");
  const switchText = document.getElementById("switch-text");
  const switchLink = document.getElementById("switch-link");
  const messagesEl = document.getElementById("messages");

  const messageInput = document.getElementById("message-input");
  const attachInput = document.getElementById("attach-input");
  const sendBtn = document.getElementById("send-btn");
  const replyPreview = document.getElementById("reply-preview");
  const replySnippetText = document.getElementById("reply-snippet-text");
  const uploadStatus = document.getElementById("upload-status");

  switchLink.onclick = () => {
    mode = mode === "login" ? "register" : "login";
    authTagline.textContent = mode === "login" ? "Log in to continue the conversation." : "Create an account to start a conversation.";
    authSubmit.textContent = mode === "login" ? "Log in" : "Register";
    switchText.innerHTML = mode === "login" ? 'No account yet? <a id="switch-link">Register</a>' : 'Already have an account? <a id="switch-link">Log in</a>';
    document.getElementById("switch-link").onclick = switchLink.onclick;
    authError.textContent = "";
  };

  authSubmit.onclick = async () => {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    authError.textContent = "";
    if (!username || !password) { authError.textContent = "Fill in both fields."; return; }
    try {
      const res = await fetch(`${API_BASE}/api/${mode}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username, password }), });
      const data = await res.json();
      if (!res.ok) { authError.textContent = data.error || "Something went wrong."; return; }
      token = data.token;
      localStorage.setItem("chat_token", token);
      startChat();
    } catch {
      authError.textContent = "Couldn't reach the server.";
    }
  };

  async function loadHistory() {
    const res = await fetch(`${API_BASE}/api/messages`, { headers: { Authorization: `Bearer ${token}` }, });
    if (!res.ok) { logout(); return; }
    const msgs = await res.json();
    messagesEl.innerHTML = "";
    messageEls.clear();
    messageData.clear();
    msgs.forEach(renderMessage);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderPreviewCard(preview) {
    const a = document.createElement("a");
    a.className = "preview-card";
    a.href = preview.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML = `${preview.image ? `<img src="${escapeAttr(preview.image)}" loading="lazy" />` : ""}<div class="preview-body"><div class="preview-site">${escapeHtml(preview.siteName || "")}</div><div class="preview-title">${escapeHtml(preview.title || preview.url)}</div>${preview.description ? `<div class="preview-desc">${escapeHtml(preview.description)}</div>` : ""}</div>`;
    return a;
  }

  function escapeHtml(s) { return (s || "").replace(/[&<>\"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function escapeAttr(s) { return escapeHtml(s); }
  function formatTime(iso) { if (!iso) return ""; const d = new Date(iso); return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }

  const INSTAGRAM_RE = /https?:\/\/(?:www\.)?instagram\.com\/(?:[A-Za-z0-9_.]+\/)??(reel|reels|p|tv)\/([A-Za-z0-9_-]+)/i;
  function renderInstagramEmbed(text) { const m = text.match(INSTAGRAM_RE); if (!m) return null; const kind = m[1].toLowerCase() === "reels" ? "reel" : m[1].toLowerCase(); const src = `https://www.instagram.com/${kind}/${m[2]}/embed/`; const card = document.createElement("div"); card.className = "ig-embed"; card.setAttribute("role", "button"); card.tabIndex = 0; card.innerHTML = `<span class="ig-label">Instagram ${kind === "reel" ? "reel" : "post"}</span><span class="ig-hint">Tap to load</span>`; const load = () => { const frame = document.createElement("iframe"); frame.className = "ig-frame"; frame.src = src; frame.allow = "encrypted-media; autoplay; fullscreen"; frame.allowFullscreen = true; frame.setAttribute("scrolling", "no"); card.replaceWith(frame); }; card.onclick = load; card.onkeydown = (e) => { if (e.key === "Enter") load(); }; return card; }

  function summarize(m) { if (!m) return "a message"; if (m.type === "image") return "📷 Image"; if (m.type === "video") return "🎥 Video"; return m.content.length > 60 ? m.content.slice(0, 60) + "…" : m.content; }

  function renderMessage(m) {
    if (m.id) messageData.set(m.id, { sender: m.sender, type: m.type, content: m.content });
    const wrap = document.createElement("div"); wrap.className = "msg-row"; wrap.style.alignSelf = m.sender === "user" ? "flex-end" : "flex-start"; wrap.style.alignItems = m.sender === "user" ? "flex-end" : "flex-start";

    if (m.reply_to && messageData.has(m.reply_to)) {
      const quoted = messageData.get(m.reply_to); const who = quoted.sender === "user" ? "You" : "Willow"; const quote = document.createElement("div"); quote.className = "quote-block"; quote.innerHTML = `<b>${escapeHtml(who)}</b> — ${escapeHtml(summarize(quoted))}`; wrap.appendChild(quote);
    }

    const group = document.createElement("div"); group.className = `msg-group ${m.sender === "user" ? "user" : "admin"}`;
    const div = document.createElement("div"); div.className = `msg ${m.sender}`;
    if (m.type === "image") { const img = document.createElement("img"); img.className = "chat-image"; img.loading = "lazy"; img.decoding = "async"; img.src = m.content; img.onclick = () => window.open(m.content, "_blank"); div.appendChild(img);
    } else if (m.type === "video") { const video = document.createElement("video"); video.className = "chat-video"; video.src = m.content; video.controls = true; video.playsInline = true; video.preload = "metadata"; div.appendChild(video);
    } else { div.textContent = m.content; }
    group.appendChild(div);
    if (m.id) { const replyBtn = document.createElement("button"); replyBtn.className = "reply-btn"; replyBtn.title = "Reply"; replyBtn.textContent = "↩"; replyBtn.onclick = () => setReplyTarget(m.id); group.appendChild(replyBtn); }
    wrap.appendChild(group);
    if (m.type === "text") { const ig = renderInstagramEmbed(m.content); if (ig) { wrap.classList.add("has-embed"); wrap.appendChild(ig); } }
    if (m.created_at) { const time = document.createElement("div"); time.className = "msg-time"; time.textContent = formatTime(m.created_at); wrap.appendChild(time); }
    if (m.link_preview) { wrap.appendChild(renderPreviewCard(m.link_preview)); }
    messagesEl.appendChild(wrap);
    if (m.id) messageEls.set(m.id, wrap);
  }

  function setReplyTarget(id) { const data = messageData.get(id); if (!data) return; replyingTo = { id, ...data }; const who = data.sender === "user" ? "yourself" : "Willow"; replySnippetText.textContent = `${who}: ${summarize(data)}`; replyPreview.style.display = "flex"; messageInput.focus(); }
  document.getElementById("cancel-reply").onclick = () => { replyingTo = null; replyPreview.style.display = "none"; };

  function startChat() {
    authCard.style.display = "none"; chatView.style.display = "flex"; loadHistory(); if (pendingFcmToken) { sendFcmToken(pendingFcmToken); pendingFcmToken = null; }
    socket = io(API_BASE, { auth: { token } });
    socket.on("connect", () => { /* connected */ });
    socket.on("message", (m) => { renderMessage(m); messagesEl.scrollTop = messagesEl.scrollHeight; });
    socket.on("message-preview", ({ id, link_preview }) => { const wrap = messageEls.get(id); if (wrap) wrap.appendChild(renderPreviewCard(link_preview)); });
    socket.on("connect_error", () => { logout(); });

    // tidy up on unload
    window.addEventListener('pagehide', () => { if (socket) socket.disconnect(); });
    window.addEventListener('beforeunload', () => { if (socket) socket.disconnect(); });
  }

  function logout() { localStorage.removeItem("chat_token"); token = null; chatView.style.display = "none"; authCard.style.display = "block"; if (socket) { socket.disconnect(); socket = null; } }

  function sendMessage() { const text = messageInput.value; if (!text.trim() || !socket) return; socket.emit("message", { content: text, type: "text", replyTo: replyingTo?.id || null }); messageInput.value = ""; replyingTo = null; replyPreview.style.display = "none"; }
  document.getElementById("send-btn").onclick = sendMessage;
  messageInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

  const MAX_IMAGE_DIMENSION = 1600; const JPEG_QUALITY = 0.82;
  function compressImage(file) { return new Promise((resolve, reject) => { const type = (file.type || "").toLowerCase(); if (type === "image/gif") { resolve({ blob: file, mimeType: file.type || "image/gif" }); return; } const img = new Image(); const objectUrl = URL.createObjectURL(file); img.onload = () => { URL.revokeObjectURL(objectUrl); let { width, height } = img; if (width > MAX_IMAGE_DIMENSION || height > MAX_IMAGE_DIMENSION) { const scale = MAX_IMAGE_DIMENSION / Math.max(width, height); width = Math.round(width * scale); height = Math.round(height * scale); } const canvas = document.createElement("canvas"); canvas.width = width; canvas.height = height; canvas.getContext("2d").drawImage(img, 0, 0, width, height); canvas.toBlob((blob) => (blob ? resolve({ blob, mimeType: "image/jpeg" }) : reject(new Error("Compression failed"))), "image/jpeg", JPEG_QUALITY); }; img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error("Couldn't read image")); }; img.src = objectUrl; }); }

  const MAX_VIDEO_DURATION = 90; const VIDEO_MAX_DIMENSION = 854; const VIDEO_BITRATE = 1_200_000;
  function normalizeMimeType(value) { return String(value || "").split(";")[0].trim().toLowerCase(); }
  function normalizeVideoMimeType(file) { const type = (file.type || "").toLowerCase(); if (type.includes("quicktime")) return "video/quicktime"; if (type.includes("mp4")) return "video/mp4"; if (type.includes("webm")) return "video/webm"; if (type.includes("3gpp")) return "video/3gpp"; if (type.includes("x-m4v")) return "video/x-m4v"; return "video/mp4"; }
  function canCompressVideo() { return typeof MediaRecorder !== "undefined" && typeof HTMLVideoElement !== "undefined" && typeof HTMLVideoElement.prototype.captureStream === "function" && typeof HTMLCanvasElement !== "undefined" && typeof HTMLCanvasElement.prototype.captureStream === "function"; }
  function compressVideo(file, onProgress) { return new Promise((resolve, reject) => { const fallbackMimeType = normalizeVideoMimeType(file); if (!canCompressVideo()) { resolve({ blob: file, mimeType: fallbackMimeType }); return; } const video = document.createElement("video"); video.muted = false; video.playsInline = true; video.src = URL.createObjectURL(file); video.onloadedmetadata = () => { if (video.duration > MAX_VIDEO_DURATION) { URL.revokeObjectURL(video.src); reject(new Error(`Videos must be under ${MAX_VIDEO_DURATION} seconds.`)); return; } let { videoWidth: width, videoHeight: height } = video; if (width > VIDEO_MAX_DIMENSION || height > VIDEO_MAX_DIMENSION) { const scale = VIDEO_MAX_DIMENSION / Math.max(width, height); width = Math.round(width * scale / 2) * 2; height = Math.round(height * scale / 2) * 2; } const canvas = document.createElement("canvas"); canvas.width = width; canvas.height = height; const ctx = canvas.getContext("2d"); if (!canvas.captureStream) { URL.revokeObjectURL(video.src); resolve({ blob: file, mimeType: fallbackMimeType }); return; } const canvasStream = canvas.captureStream(30); try { const audioTracks = video.captureStream().getAudioTracks(); audioTracks.forEach((t) => canvasStream.addTrack(t)); } catch {} const mimeType = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"].find((t) => MediaRecorder.isTypeSupported(t)) || "video/webm"; const recorder = new MediaRecorder(canvasStream, { mimeType, videoBitsPerSecond: VIDEO_BITRATE }); const chunks = []; recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); }; recorder.onstop = () => { URL.revokeObjectURL(video.src); const encoded = new Blob(chunks, { type: mimeType }); if (encoded.size === 0 || (file.size > 1024 && encoded.size < 1024)) { resolve({ blob: file, mimeType: fallbackMimeType }); return; } resolve({ blob: encoded, mimeType: normalizeMimeType(encoded.type || mimeType || fallbackMimeType) }); }; recorder.onerror = (e) => { URL.revokeObjectURL(video.src); reject(e.error || new Error("Recording failed")); }; let rafId; const drawFrame = () => { ctx.drawImage(video, 0, 0, width, height); if (onProgress) onProgress(video.currentTime / video.duration); if (!video.ended) rafId = requestAnimationFrame(drawFrame); }; video.onended = () => { cancelAnimationFrame(rafId); recorder.stop(); }; recorder.start(); video.play().then(drawFrame).catch((err) => { recorder.stop(); reject(err); }); }; video.onerror = () => { URL.revokeObjectURL(video.src); reject(new Error("Couldn't read video")); }; }); }

  document.getElementById("attach-btn").onclick = () => attachInput.click();
  attachInput.addEventListener("change", async () => {
    const file = attachInput.files[0];
    attachInput.value = "";
    if (!file || !socket) return;
    const fileName = (file.name || "").toLowerCase();
    const isVideo = file.type.startsWith("video/") || /\.(mp4|mov|webm|3gp|3g2|m4v)$/i.test(fileName);
    const rawLimit = isVideo ? 150 * 1024 * 1024 : 20 * 1024 * 1024;
    if (file.size > rawLimit) { alert(`File must be under ${Math.round(rawLimit / 1024 / 1024)}MB.`); return; }
    sendBtn.disabled = true; uploadStatus.style.display = "block"; uploadStatus.textContent = isVideo ? "Uploading video…" : "Processing image…";
    let blob, mimeType;
    try { if (isVideo) { blob = file; mimeType = normalizeVideoMimeType(file); } else { ({ blob, mimeType } = await compressImage(file)); } } catch (err) { alert(err.message || "Couldn't process that file."); uploadStatus.style.display = "none"; sendBtn.disabled = false; return; }
    const finalLimit = isVideo ? 25 * 1024 * 1024 : 5 * 1024 * 1024; if (blob.size > finalLimit) { alert(`File is too large for upload (${Math.round(blob.size / 1024 / 1024)}MB). Try a smaller clip.`); uploadStatus.style.display = "none"; sendBtn.disabled = false; return; }
    if (!blob || blob.size <= 0 || (isVideo && blob.size < 1024 && file.size > 1024)) { alert("This file is empty or could not be read."); uploadStatus.style.display = "none"; sendBtn.disabled = false; return; }
    uploadStatus.textContent = "Uploading…";
    const safeMimeType = normalizeMimeType(mimeType || (isVideo ? "video/mp4" : "image/jpeg"));
    try {
      const formData = new FormData();
      formData.append("file", blob, file.name || `upload.${isVideo ? "mp4" : "jpg"}`);
      formData.append("mimeType", safeMimeType);
      const res = await fetch(`${API_BASE}/api/upload`, { method: "POST", headers: { Authorization: `Bearer ${token}` }, body: formData, });
      const data = await res.json();
      if (!res.ok) { alert(data.error || "Upload failed."); return; }
      socket.emit("message", { content: data.url, type: isVideo ? "video" : "image", replyTo: replyingTo?.id || null });
      replyingTo = null; replyPreview.style.display = "none";
    } catch {
      alert("Couldn't upload that file.");
    } finally { uploadStatus.style.display = "none"; sendBtn.disabled = false; }
  });

  // If token exists, start chat automatically
  if (token) startChat();
</script>
